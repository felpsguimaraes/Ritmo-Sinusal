name: Indexar vídeos de Anatomia UPE individualmente

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/sincronizar_anatomia_upe.py"
      - ".github/workflows/sincronizar-anatomia-upe.yml"
  schedule:
    - cron: "12 9 * * *"

permissions:
  contents: write

concurrency:
  group: sinus-anatomia-upe-individual
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar indexador do YouTube
        run: python -m pip install --upgrade yt-dlp
      - name: Extrair IDs e títulos dos dois canais (sem baixar vídeos)
        run: python tools/sincronizar_anatomia_upe.py
      - name: Atualizar os cartões individuais no repositório
        run: |
          if git diff --quiet -- sinus/anatomia-upe-videos.json; then
            echo "Nenhum vídeo novo identificado."
            exit 0
          fi
          git config user.name "SINUS Videoteca"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sinus/anatomia-upe-videos.json
          git commit -m "chore(anatomia): indexar individualmente os vídeos UPE Franco e UPE 2188"
          git pull --rebase origin main
          git push origin HEAD:main
