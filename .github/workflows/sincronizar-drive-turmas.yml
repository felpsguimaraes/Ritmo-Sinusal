name: Sincronizar Drive das turmas (5º)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/sincronizar_drive_turmas.py"
      - "sinus/drive-turmas.json"
      - ".github/workflows/sincronizar-drive-turmas.yml"
  schedule:
    - cron: "15 8 * * *"

permissions:
  contents: write

concurrency:
  group: sinus-drive-turmas
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências do Google Drive
        run: python -m pip install --upgrade google-api-python-client google-auth
      - name: Consultar pastas das turmas (somente metadados)
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python tools/sincronizar_drive_turmas.py
      - name: Salvar índice se houve mudança
        run: |
          if git diff --quiet -- biblioteca/dados/drive-turmas-5.json; then
            echo "Nenhuma mudança."
            exit 0
          fi
          git config user.name "SINUS Drive Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biblioteca/dados/drive-turmas-5.json
          git commit -m "chore(drive): atualizar índice de slides das turmas do 5º"
          git push origin HEAD:main
