name: Publicar SINUS no Cloudflare Pages (meusinus)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: meusinus-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Implantar main em meusinus.pages.dev
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Obter arquivos da branch main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validar catálogo e scripts da Cátedra
        shell: bash
        run: |
          node --check sinus/anatomia-pratica-videos.js
          node --check sinus/ucp-catedra-catalog.js
          node --check sinus/subject-viewer-order.js
          node --check sinus/subject-resource-balloons.js
          test -s sinus/anatomia-upe-videos.json
          test -s sinus/anatomia-pratica-videos.json
          grep -Fq 'catedra-navfix3' index.html
          grep -Fq "if(tab==='catedra'&&course())" sinus/anatomia-pratica-videos.js

      - name: Preparar somente os arquivos públicos do site
        shell: bash
        run: |
          mkdir -p .cf-pages-dist
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.cf-pages-dist/' \
            --exclude='supabase/' \
            --exclude='tools/' \
            --exclude='releases/' \
            --exclude='*.sql' \
            --exclude='*.zip' \
            --exclude='README.md' \
            --exclude='*.md' \
            --exclude='admin/control/tests/' \
            --exclude='admin/control/catalog.json' \
            --exclude='wrangler.jsonc' \
            --exclude='netlify.toml' \
            --exclude='.assetsignore' \
            ./ .cf-pages-dist/
          test -s .cf-pages-dist/index.html
          test -s .cf-pages-dist/sinus/anatomia-pratica-videos.js
          test -s .cf-pages-dist/_headers
          test -s .cf-pages-dist/_redirects

      - name: Preparar pacote de contingência para publicação manual
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sinus-meusinus-site-${{ github.sha }}
          path: .cf-pages-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Informar integração Cloudflare Pages não configurada
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        shell: bash
        run: |
          echo "::notice::Publicação no Pages 'meusinus' ignorada: faltam CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID como segredos Actions. O pacote do SINUS continua disponível na aba Artifacts desta execução. A publicação do site segue pelo Worker 'sinus' (integração Git da Cloudflare)."

      - name: Publicar diretamente no projeto meusinus
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .cf-pages-dist --project-name=meusinus --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar HTML e player no domínio de produção
        env:
          GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # Confere que o Cloudflare está servindo o HTML e o JS corrigido,
          # não apenas que o GitHub recebeu o commit.
          for attempt in 1 2 3 4 5 6; do
            URL="https://meusinus.pages.dev/?cf-check=$GIT_SHA-$attempt"
            JS_URL="https://meusinus.pages.dev/sinus/anatomia-pratica-videos.js?v=20261025-catedra-navfix3&cf-check=$GIT_SHA-$attempt"
            if curl -fLsS --connect-timeout 15 --max-time 40 "$URL" -o /tmp/sinus-home.html &&
               curl -fLsS --connect-timeout 15 --max-time 40 "$JS_URL" -o /tmp/sinus-catedra.js &&
               grep -Fq 'catedra-navfix3' /tmp/sinus-home.html &&
               grep -Fq "if(tab==='catedra'&&course())" /tmp/sinus-catedra.js &&
               node --check /tmp/sinus-catedra.js; then
              echo "Verificado: HTML e JS corrigidos disponíveis em meusinus.pages.dev"
              exit 0
            fi
            sleep 8
          done
          echo "::error::O site ainda não serviu a versão com a navegação corrigida da Cátedra."
          exit 1
