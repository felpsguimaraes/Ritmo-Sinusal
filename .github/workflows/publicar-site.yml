# Pede ao GitHub Pages para publicar o site a cada envio para a main
# (necessário porque envios feitos por apps não disparam a publicação sozinhos).
name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir nova publicação do GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
