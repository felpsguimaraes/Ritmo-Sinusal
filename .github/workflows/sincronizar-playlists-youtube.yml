name: Sincronizar playlists por matéria

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/sincronizar_playlists_youtube.py"
      - ".github/workflows/sincronizar-playlists-youtube.yml"
  schedule:
    - cron: "45 8 * * *"

permissions:
  contents: write

concurrency:
  group: sinus-playlists-catalogo
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar indexador
        run: python -m pip install --upgrade yt-dlp
      - name: Consultar playlists públicas
        run: python tools/sincronizar_playlists_youtube.py
      - name: Salvar coleção de playlists
        run: |
          if git diff --quiet -- sinus/youtube-playlists.json; then
            echo "Nenhuma mudança."
            exit 0
          fi
          git config user.name "SINUS Videoteca"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sinus/youtube-playlists.json
          git commit -m "chore(videoteca): atualizar playlists públicas por matéria"
          git push origin HEAD:main
