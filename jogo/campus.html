<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SINUS · Campus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07110e;--glass:rgba(9,19,17,.92);--line:rgba(255,255,255,.09);
  --accent:#4ade80;--accent-soft:rgba(74,222,128,.16);--teal:#5eead4;
  --text:#f1f7f4;--muted:#9fb3ab;--bad:#f87171;
  --ease:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}

/* ---------- palco: a arte original em 1536x1024, escalada para caber ---------- */
#stage{position:absolute;left:50%;top:50%;width:1536px;height:1024px;transform:translate(-50%,-50%) scale(var(--fit,1));overflow:hidden;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#cam{position:absolute;inset:0;transform-origin:0 0;transition:transform 1.05s var(--ease);will-change:transform}
#cam img.arte{position:absolute;inset:0;width:1536px;height:1024px;display:block;user-select:none;-webkit-user-drag:none}
#veu{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 30% 50%,transparent 30%,rgba(3,8,6,.5) 70%),linear-gradient(90deg,transparent 45%,rgba(3,8,6,.55));opacity:0;transition:opacity .9s}
body.esq #veu{background:radial-gradient(ellipse at 70% 50%,transparent 30%,rgba(3,8,6,.5) 70%),linear-gradient(270deg,transparent 45%,rgba(3,8,6,.55))}
body.zoom #veu{opacity:1}
body.zoom .hud-hit,body.zoom .live,body.zoom #piso{pointer-events:none}

/* ---------- efeitos vivos sobre a arte ---------- */
svg#fx{position:absolute;inset:0;width:1536px;height:1024px;overflow:visible}
#piso{fill:transparent;cursor:pointer}
.sala-hit{fill:rgba(74,222,128,0);stroke:transparent;stroke-width:3;cursor:pointer;transition:fill .25s,stroke .25s,filter .25s}
.sala-hit:hover,.sala-hit.on{fill:rgba(74,222,128,.10);stroke:#4ade80;filter:drop-shadow(0 0 10px rgba(74,222,128,.9))}
body.zoom .sala-hit{pointer-events:none;stroke:transparent;fill:transparent}
.sala-hit:focus{outline:none}
.sala-hit:focus-visible{stroke:#4ade80;fill:rgba(74,222,128,.10)}
.ecg{fill:none;stroke:#86efac;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60 400;animation:ecg 2.4s linear infinite;filter:drop-shadow(0 0 6px #4ade80)}
@keyframes ecg{from{stroke-dashoffset:460}to{stroke-dashoffset:0}}
.halo{transform-origin:783px 455px;animation:halo 1.2s ease-in-out infinite;mix-blend-mode:screen}
@keyframes halo{0%,100%{opacity:.35;transform:scale(.94)}15%{opacity:.85;transform:scale(1.06)}30%{opacity:.45;transform:scale(.98)}45%{opacity:.75;transform:scale(1.03)}}
.part{fill:#a7f3d0;mix-blend-mode:screen;animation:sobe 5s linear infinite}
@keyframes sobe{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-150px);opacity:0}}
.chev{animation:chev 1.6s ease-in-out infinite;mix-blend-mode:screen}
@keyframes chev{0%,100%{opacity:.15}50%{opacity:.9}}
.destino{fill:none;stroke:#86efac;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.destino.on{animation:destino .9s ease-out}
@keyframes destino{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
.porta{fill:#4ade80;opacity:.0;mix-blend-mode:screen;transition:opacity .3s}
.porta.on{opacity:.55;animation:porta 1s ease-in-out infinite}
@keyframes porta{50%{opacity:.25}}

/* ---------- personagem ---------- */
#player{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;transition:opacity .35s}
#player .corpo{position:absolute;left:0;top:0;transform-origin:50% 100%}
#player .vira{transform-origin:50% 100%;transition:transform .2s}
#player.esq .vira{transform:scaleX(-1)}
#player img{display:block;width:66px;height:135px;transform-origin:50% 100%}
#player.andando img{animation:passo .38s ease-in-out infinite}
@keyframes passo{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4px) rotate(-1.6deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-4px) rotate(1.6deg)}}
#player .sombra{position:absolute;left:-36px;top:-12px;width:72px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,30,25,.45),rgba(20,30,25,0));}
#player .luz{position:absolute;left:-48px;top:-15px;width:96px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(134,239,172,.75),rgba(34,197,94,0));mix-blend-mode:screen;animation:luz 2s ease-in-out infinite}
@keyframes luz{50%{opacity:.35}}
#player.saindo{opacity:0}

/* ---------- áreas clicáveis da interface desenhada ---------- */
.hud-hit{position:absolute;border:0;background:transparent;border-radius:12px;cursor:pointer;transition:background .2s,box-shadow .2s}
.hud-hit:hover{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.hud-hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hud-hit.redondo{border-radius:50%}

/* ---------- valores ao vivo pintados por cima da arte ---------- */
.live{position:absolute;pointer-events:none}
.foco-txt{left:98px;top:234px;width:94px;height:50px;background:linear-gradient(90deg,#0e1a1e,#1f2523 70%,#242522);padding:4px 0 0 5px}
.foco-txt b{display:block;font-size:19px;font-weight:700;letter-spacing:-.2px;color:#fff;line-height:22px}
.foco-txt small{display:block;font-size:13.5px;color:#c3cdc9;margin-top:2px}
.anel{left:23px;top:219px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle,#0e1c20 62%,rgba(14,28,32,0) 72%)}
.num{width:52px;height:20px;background:#0c1a21;font-size:13.5px;color:#cfd8da;text-align:right;line-height:20px;padding-right:4px}
.barra{left:68px;width:194px;height:14px;background:#0c1a21;padding:3px 4px}
.barra i{display:block;height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.barra i u{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#6ee7b7,#4ade80);transition:width .6s var(--ease)}
.ico{width:28px;height:28px;border-radius:50%;background:#0c1a21;display:grid;place-items:center}

/* ---------- painel (fora do palco, sempre nítido) ---------- */
#painel{position:fixed;top:50%;right:clamp(12px,3vw,48px);width:min(480px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow:auto;transform:translate(30px,-50%);opacity:0;pointer-events:none;transition:opacity .45s,transform .45s var(--ease);background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:22px;backdrop-filter:blur(16px);box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:20}
#painel.on{opacity:1;transform:translate(0,-50%);pointer-events:auto}
body.esq #painel{right:auto;left:clamp(12px,3vw,48px);transform:translate(-30px,-50%)}
body.esq #painel.on{transform:translate(0,-50%)}
.p-top{display:flex;align-items:center;gap:12px}
.badge{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--accent);background:rgba(74,222,128,.08);flex:none;box-shadow:0 0 18px rgba(74,222,128,.35)}
.p-top h3{margin:0;font-size:19px;font-weight:700;line-height:1.2}
.p-top small{color:var(--muted);font-size:13px}
.xp{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.xp b{display:block;font-size:16px;color:var(--accent)}
.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.prof{margin:14px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.prof b{color:#dbe7e1;font-weight:600}
.modo{display:flex;gap:4px;margin:16px 0 4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.modo button{flex:1;padding:9px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.modo button.on{background:var(--accent-soft);color:var(--accent)}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.acao{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);text-decoration:none;cursor:pointer;text-align:left;min-width:0;transition:border-color .2s,background .2s,transform .15s}
.acao:hover{border-color:rgba(74,222,128,.6);background:rgba(74,222,128,.06);transform:translateY(-1px)}
.acao:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acao .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:15px}
.acao b{font-size:13.5px;font-weight:600;line-height:1.25}
.acao small{font-size:11.5px;color:var(--muted);line-height:1.3}
.acao.destaque{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(74,222,128,.16),rgba(94,234,212,.06));border-color:rgba(74,222,128,.45)}
.acao.destaque .ic{background:var(--accent);color:#052e16}
.nota{margin:14px 0 0;font-size:12px;color:var(--muted)}
.prog{display:flex;gap:6px;margin:18px 0 6px}
.prog i{flex:1;height:5px;border-radius:4px;background:rgba(255,255,255,.1)}
.prog i.ok{background:var(--accent)}.prog i.no{background:var(--bad)}.prog i.cur{background:var(--teal)}
.qnum{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:12px}
#painel h2{font-size:18px;line-height:1.4;margin:8px 0 16px;font-weight:600}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:15px;line-height:1.35;cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
.opt:hover:not(:disabled){border-color:rgba(74,222,128,.6);background:rgba(74,222,128,.06);transform:translateX(2px)}
.opt .l{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:12px;font-weight:700;flex:none}
.opt.ok{border-color:var(--accent);background:rgba(34,197,94,.16)}.opt.ok .l{background:var(--accent);color:#052e16}
.opt.no{border-color:var(--bad);background:rgba(248,113,113,.12)}.opt.no .l{background:var(--bad);color:#450a0a}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(94,234,212,.07);border:1px solid rgba(94,234,212,.2);font-size:14px;line-height:1.5;color:#d5e4df;display:none}
.exp.on{display:block}
.acoes{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:600;cursor:pointer}
.btn.pri{border:0;background:linear-gradient(90deg,#86efac,#4ade80);color:#052e16;box-shadow:0 8px 24px rgba(74,222,128,.3)}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:10px 0}
.res .big{font-size:46px;font-weight:800;color:var(--accent);line-height:1}
.res p{color:var(--muted);margin:8px 0 0}
.lista-prog{list-style:none;padding:0;margin:16px 0 0}
.lista-prog li{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.lista-prog li span{color:var(--muted)}
.lista-prog li i{grid-column:1/3;height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.lista-prog li i u{display:block;height:100%;background:linear-gradient(90deg,#6ee7b7,#4ade80)}

#voltar{position:fixed;left:clamp(12px,2vw,28px);top:clamp(12px,2vw,24px);z-index:21;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);font-weight:600;font-size:14px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
body.zoom #voltar{opacity:1;pointer-events:auto}
body.esq #voltar{left:auto;right:clamp(12px,2vw,28px)}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);opacity:0;z-index:30;padding:10px 18px;border-radius:999px;background:var(--glass);border:1px solid rgba(74,222,128,.4);font-size:14px;transition:opacity .3s,transform .3s var(--ease);pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#tip{position:absolute;padding:7px 12px;border-radius:999px;background:rgba(8,16,13,.92);border:1px solid rgba(74,222,128,.5);font-size:13px;font-weight:600;color:var(--accent);pointer-events:none;opacity:0;transform:translate(-50%,-100%);transition:opacity .2s;white-space:nowrap}
#tip.on{opacity:1}

@media (max-width:760px){
  #painel,body.esq #painel{top:auto;bottom:12px;left:12px;right:12px;width:auto;transform:translateY(30px);max-height:62vh}
  #painel.on,body.esq #painel.on{transform:none}
  .grade{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div id="stage">
  <div id="cam">
    <img class="arte" src="assets/sinus-campus-vazio.jpg" alt="Campus SINUS com salas de estudo ao redor de um coração holográfico">

    <svg id="fx" viewBox="0 0 1536 1024">
      <defs>
        <radialGradient id="gHalo"><stop offset="0" stop-color="#86efac" stop-opacity=".75"/><stop offset=".45" stop-color="#22c55e" stop-opacity=".28"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
      </defs>
      <!-- piso clicável: a personagem anda até o ponto -->
      <rect id="piso" x="0" y="0" width="1536" height="1024"/>
      <!-- coração pulsando -->
      <ellipse class="halo" cx="783" cy="455" rx="150" ry="150" fill="url(#gHalo)" pointer-events="none"/>
      <g id="particulas" pointer-events="none"></g>
      <polyline class="ecg" pointer-events="none" points="690,642 748,642 760,642 771,614 784,668 797,624 808,642 820,642 878,642"/>
      <g class="chev" pointer-events="none" fill="none" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="766,890 781,880 796,890"/><polyline points="766,902 781,892 796,902"/>
      </g>
      <!-- portas das salas (acendem quando a personagem vai até elas) -->
      <g id="portas" pointer-events="none"></g>
      <circle id="destino" class="destino" cx="0" cy="0" r="16" pointer-events="none"/>
      <!-- salas clicáveis (contorno acompanha a arte) -->
      <g id="salas"></g>

    <!-- a estudante, recortada da própria arte -->
    <div id="player" aria-hidden="true">
      <div class="luz"></div><div class="sombra"></div>

    <div class="live anel"><svg width="76" height="76" viewBox="0 0 76 76">
      <defs><linearGradient id="gAnel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#4ade80"/></linearGradient></defs>
      <circle cx="38" cy="38" r="29" fill="none" stroke="#2a3a3d" stroke-width="6"/>
      <circle id="anel" cx="38" cy="38" r="29" fill="none" stroke="url(#gAnel)" stroke-width="6" stroke-linecap="round" transform="rotate(-90 38 38)" stroke-dasharray="182.2" stroke-dashoffset="182.2"/>
    </svg></div>
    <div class="live foco-txt"><b id="focoTxt">0h 0min</b><small>de 8h</small></div>

    <!-- valores ao vivo sobre "Desafios da semana" -->
    <div id="desafios"></div>

    <!-- áreas clicáveis da interface que já está desenhada -->
    <div id="hits"></div>
  </div>
  <div id="veu"></div>
  <div id="tip">Entrar na sala ›</div>
</div>

<button id="voltar">← Voltar ao campus</button>
<div id="toast"></div>
<section id="painel" aria-live="polite"></section>

<script>

// funções de cada matéria, com os mesmos nomes do app
const FUNCOES = {

const PERGUNTAS = {

// ===================== palco e câmera =====================
const $ = id => document.getElementById(id);
const cam = $('cam');
let FIT = 1;
function encaixar() {
  FIT = Math.min(innerWidth / 1536, innerHeight / 1024);
  document.documentElement.style.setProperty('--fit', FIT);
}
addEventListener('resize', encaixar);
encaixar();

// mantém a arte cobrindo o palco inteiro (sem bordas vazias no zoom)
function limitar(cx, cy, z, ax, ay) {
  return [Math.min(Math.max(cx, ax / z), 1536 - (1536 - ax) / z), Math.min(Math.max(cy, ay / z), 1024 - (1024 - ay) / z)];
}
function camera(cx = 768, cy = 512, z = 1, ax = 768, ay = 512) {
  [cx, cy] = limitar(cx, cy, z, ax, ay);
  cam.style.transform = `translate(${ax}px,${ay}px) scale(${z}) translate(${-cx}px,${-cy}px)`;
}
camera();

function caixa(poly) {
  const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  return { x0, x1, y0, y1, cx:(x0 + x1) / 2, cy:(y0 + y1) / 2, w:x1 - x0, h:y1 - y0 };
}
function focar(sala) {
  const b = caixa(sala.poly);
  const estreito = innerWidth < 760;
  // painel fica do lado oposto à sala, para a sala aparecer inteira
  const esq = !estreito && b.cx > 768;
  document.body.classList.toggle('esq', esq);
  const ax = estreito ? 768 : 1536 * (esq ? 0.68 : 0.32), ay = estreito ? 1024 * 0.3 : 512;
  const [l0, l1] = estreito ? [0, 1536] : esq ? [1536 * 0.36, 1536] : [0, 1536 * 0.64];
  let z = Math.min(estreito ? 1536 / b.w * 0.9 : 1536 * 0.55 / b.w, 1024 * 0.8 / b.h, 2.2);
  while (z > 1.05) {
    const [cx] = limitar(b.cx, b.cy, z, ax, ay);
    if (ax + z * (b.x1 - cx) <= l1 && ax + z * (b.x0 - cx) >= l0) break;
    z -= 0.05;
  }
  camera(b.cx, b.cy, z, ax, ay);
  document.body.classList.add('zoom');
}
function campus() {
  camera();
  document.body.classList.remove('zoom', 'esq');
  $('painel').classList.remove('on');
  SALAS.forEach(s => { s.el.classList.remove('on'); s.porta.classList.remove('on'); });
  // a estudante sai da sala pela mesma porta
  if (P.dentro) { P.dentro = null; setTimeout(() => $('player').classList.remove('saindo'), 500); }
  G = null;
}

// ===================== personagem e caminhos =====================
const P = { x:NOS.S[0], y:NOS.S[1], rota:[], aoChegar:null, dentro:null };
const VEL = 260; // unidades da arte por segundo
const player = $('player'), corpo = player.querySelector('.corpo');

// perspectiva: menor quanto mais ao fundo do campus
const escala = y => 0.6 + 0.4 * Math.min(Math.max((y - 388) / (858 - 388), 0), 1);
function desenharPlayer() {
  const s = escala(P.y);
  player.style.transform = `translate(${P.x}px,${P.y}px)`;
  corpo.style.transform = `translate(-33px,-135px) scale(${s})`;
  player.querySelector('.sombra').style.transform = `scale(${s})`;
  player.querySelector('.luz').style.transform = `scale(${s})`;
}

const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function pontoNoSegmento(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;
  const t = L ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L)) : 0;
  return [a[0] + t * dx, a[1] + t * dy];
}
function arestaMaisProxima(p) {
  let melhor = null;
  ARESTAS.forEach(([u, v]) => {
    const q = pontoNoSegmento(p, NOS[u], NOS[v]), d = dist(p, q);
    if (!melhor || d < melhor.d) melhor = { u, v, q, d };
  });
  return melhor;
}
// menor caminho entre dois nós (Dijkstra; o grafo é pequeno)
function caminho(de, ate) {
  const d = {}, ant = {}, aberto = new Set(Object.keys(NOS));
  Object.keys(NOS).forEach(k => d[k] = Infinity); d[de] = 0;
  while (aberto.size) {
    let u = null; aberto.forEach(k => { if (u === null || d[k] < d[u]) u = k; });
    aberto.delete(u);
    if (u === ate) break;
    ARESTAS.forEach(([a, b]) => {
      const v = a === u ? b : b === u ? a : null;
      if (!v || !aberto.has(v)) return;
      const nd = d[u] + dist(NOS[u], NOS[v]);
      if (nd < d[v]) { d[v] = nd; ant[v] = u; }
    });
  }
  const r = [ate]; while (r[0] !== de) r.unshift(ant[r[0]]);
  return { nos:r, custo:d[ate] };
}
// rota da posição atual até um ponto qualquer do piso
function rotaAte(alvo) {
  const de = arestaMaisProxima([P.x, P.y]), para = arestaMaisProxima(alvo);
  const mesma = (de.u === para.u && de.v === para.v) || (de.u === para.v && de.v === para.u);
  if (mesma) return [para.q];
  let melhor = null;
  [de.u, de.v].forEach(a => [para.u, para.v].forEach(b => {
    const c = caminho(a, b), total = dist([P.x, P.y], NOS[a]) + c.custo + dist(NOS[b], para.q);
    if (!melhor || total < melhor.total) melhor = { total, nos:c.nos };
  }));
  return [...melhor.nos.map(k => NOS[k]), para.q];
}
function andarAte(alvo, aoChegar) {
  if (P.dentro) return;
  P.rota = rotaAte(alvo);
  P.aoChegar = aoChegar || null;
  const d = $('destino');
  d.setAttribute('cx', alvo[0]); d.setAttribute('cy', alvo[1]);
  d.classList.remove('on'); void d.getBoundingClientRect(); d.classList.add('on');
}

const teclas = {};
let ultimo = performance.now();
function passo(t) {
  const dt = Math.min((t - ultimo) / 1000, 0.05); ultimo = t;
  let andando = false;
  if (!P.dentro && !document.body.classList.contains('zoom')) {
    // setas / WASD: anda livre, mas só sobre os caminhos do piso
    let dx = (teclas.arrowright || teclas.d ? 1 : 0) - (teclas.arrowleft || teclas.a ? 1 : 0);
    let dy = (teclas.arrowdown || teclas.s ? 1 : 0) - (teclas.arrowup || teclas.w ? 1 : 0);
    if (dx || dy) {
      P.rota = []; P.aoChegar = null;
      const n = Math.hypot(dx, dy), nx = P.x + dx / n * VEL * dt, ny = P.y + dy / n * VEL * dt;
      const a = arestaMaisProxima([nx, ny]);
      const [qx, qy] = a.d <= 24 ? [nx, ny] : a.q; // desliza pelo caminho em vez de travar
      if (dx) player.classList.toggle('esq', dx < 0);
      P.x = qx; P.y = qy; andando = true;
      // chegou numa porta andando pelas setas: entra na sala
      const s = SALAS.find(s => dist([P.x, P.y], NOS[s.no]) < 14);
      if (s) entrarNaSala(s);
    } else if (P.rota.length) {
      const alvo = P.rota[0], d = dist([P.x, P.y], alvo), passoLen = VEL * dt;
      if (Math.abs(alvo[0] - P.x) > 2) player.classList.toggle('esq', alvo[0] < P.x);
      if (d <= passoLen) { P.x = alvo[0]; P.y = alvo[1]; P.rota.shift(); }
      else { P.x += (alvo[0] - P.x) / d * passoLen; P.y += (alvo[1] - P.y) / d * passoLen; }
      andando = true;
      if (!P.rota.length && P.aoChegar) { const f = P.aoChegar; P.aoChegar = null; f(); }
    }
  }
  player.classList.toggle('andando', andando);
  desenharPlayer();
  requestAnimationFrame(passo);
}
requestAnimationFrame(passo);

// clique no piso: anda até o ponto mais próximo do caminho
$('piso').addEventListener('click', e => {
  const r = $('stage').getBoundingClientRect();
  const p = [(e.clientX - r.left) / FIT, (e.clientY - r.top) / FIT];
  const a = arestaMaisProxima(p);
  if (a.d > 90) return toast('Ande pelo piso do campus ou clique numa sala');
  andarAte(a.q);
});

  [1117, 13, 272, 42, 'Buscar', embreve('Busca')],
  [1408, 12, 42, 42, 'Notificações', () => toast(`Você tem ${D.xp} XP · sequência de ${D.seq}`), true],
  [1468, 10, 46, 46, 'Perfil', () => progresso(), true],
  // painel esquerdo
  [202, 237, 44, 44, 'Meta do dia', () => toast('Meta de hoje: 8h de foco'), true],
  [32, 312, 214, 44, 'Continuar estudando', () => continuar()],
  [24, 377, 226, 38, 'Meu progresso', () => progresso()],
  [24, 422, 226, 38, 'Agenda de estudos', () => window.open(APP + '/', '_blank', 'noopener')],
  [24, 470, 226, 38, 'Meus resumos', () => irPara('bib')],
  [24, 515, 226, 38, 'Meus exercícios', () => aleatoria()],
  [24, 561, 226, 38, 'Flashcards', () => continuar()],
  [24, 607, 226, 38, 'Simulados', () => simulado('Simulado')],
  [24, 653, 226, 38, 'Anotações', () => window.open(APP + '/', '_blank', 'noopener')],
  // cartões
  [1262, 126, 252, 72, 'Próxima aula: Semiologia I - Prática', () => irPara('semio', () => menuSala(sala('semio'), 'pratica'))],
  [1452, 94, 66, 22, 'Ver todas as aulas', () => window.open(APP + '/', '_blank', 'noopener')],
  [1003, 334, 100, 50, 'Semiologia: Teoria', () => irPara('semio', () => menuSala(sala('semio'), 'teoria'))],
  [1114, 353, 108, 52, 'Semiologia: Prática', () => irPara('semio', () => menuSala(sala('semio'), 'pratica'))],
  [252, 770, 66, 22, 'Ver todos os desafios', () => progresso()],
  [634, 922, 424, 72, 'Escolha uma sala', () => continuar()],
];
HITS.forEach(([x, y, w, h, nome, fn, redondo]) => {
  const b = document.createElement('button');
  b.className = 'hud-hit' + (redondo ? ' redondo' : '');
  Object.assign(b.style, { left:x + 'px', top:y + 'px', width:w + 'px', height:h + 'px' });
  b.setAttribute('aria-label', nome);
  b.title = nome;
  b.onclick = fn;
  $('hits').appendChild(b);
});

// desafios: números, barras e ícones ao vivo
const LINHAS = [819, 867, 915, 963];
LINHAS.forEach((y, i) => {
  $('desafios').insertAdjacentHTML('beforeend',
    `<div class="live ico" style="left:35px;top:${y - 14}px" id="ic${i}"></div>
     <div class="live num" style="left:255px;top:${y - 10}px" id="n${i}"></div>
     <div class="live barra" style="top:${y + 13}px"><i><u id="b${i}"></u></i></div>`);
});
const ICO_OK = '<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" fill="#4ade80"/><path d="M6.5 11.5l3 3 6-6.5" fill="none" stroke="#052e16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICO_NAO = '<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="#c9d2d4" stroke-width="1.8"/><path d="M7 11.5l2.8 2.8 5.2-5.6" fill="none" stroke="#c9d2d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function atualizarHud() {
  const h = Math.floor(D.focoHoje / 3600), m = Math.floor(D.focoHoje % 3600 / 60);
  $('focoTxt').textContent = `${h}h ${m}min`;
  $('anel').setAttribute('stroke-dashoffset', (182.2 * (1 - Math.min(D.focoHoje / 28800, 1))).toFixed(1));
  const metas = [
    [Math.floor(D.focoHoje / 3600), 5, 'h', D.focoHoje / 18000],
    [D.questoes, 20, '', D.questoes / 20],
    [D.materias, 1, '', D.materias],
    [D.simulados, 1, '', D.simulados],
  ];
  metas.forEach(([v, alvo, suf, frac], i) => {
    const f = Math.min(frac, 1);
    $('n' + i).textContent = `${Math.min(v, alvo)}/${alvo}${suf}`;
    $('b' + i).style.width = (f * 100) + '%';
    $('ic' + i).innerHTML = f >= 1 ? ICO_OK : ICO_NAO;
  });
}
// foco de hoje: conta só com a aba visível
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (new Date().toDateString() !== D.dia) { D.dia = new Date().toDateString(); D.focoHoje = 0; }
  D.focoHoje++;
  atualizarHud();
  if (D.focoHoje % 10 === 0) salvar();
}, 1000);
atualizarHud();

// ===================== desafio rápido e simulados =====================
let G = null; // o que está aberto no painel
const embaralhar = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);

function iniciarQuiz(s) {
  G = { tipo:'sala', sala:s, fila:embaralhar(PERGUNTAS[s.id].map(q => ({ ...q, sala:s.id }))), i:0, res:[] };
  render();
}

function simulado(titulo) {
  const ir = () => {
    camera(783, 470, 1.9, innerWidth < 760 ? 768 : 1536 * 0.32, innerWidth < 760 ? 1024 * 0.3 : 512);
    document.body.classList.remove('esq');
    document.body.classList.add('zoom');
    const todas = Object.entries(PERGUNTAS).flatMap(([id, l]) => l.map(q => ({ ...q, sala:id })));
    G = { tipo:'simulado', titulo, fila:embaralhar(todas).slice(0, 5), i:0, res:[] };
    setTimeout(render, 650);
  };
  if (document.body.classList.contains('zoom')) { campus(); setTimeout(() => andarAte(NOS.A, ir), 650); }
  else andarAte(NOS.A, ir);
}

function aleatoria() { irPara(SALAS[Math.floor(Math.random() * SALAS.length)].id); }

function continuar() {
  // a sala com menor aproveitamento (ou nunca visitada) primeiro
  const nota = s => { const p = D.porSala[s.id]; return p && p.t ? p.a / p.t : -1; };
  irPara([...SALAS].sort((a, b) => nota(a) - nota(b))[0].id);
}

function cabecalho() {
  const s = G.sala;
  const sim = G.tipo === 'simulado';
  return `<div class="p-top"><div class="badge">${sim ? '⚡' : s.n}</div><div><span class="eyebrow">${sim ? 'Simulado' : 'Desafio rápido · ' + s.sala}</span><h3>${sim ? G.titulo : s.materia}</h3></div>
    <div class="xp"><b>${D.xp} XP</b>sequência ${D.seq}</div></div>`;
}

function render() {
  const p = $('painel');
  if (!G) return;
  if (G.i >= G.fila.length) return resultado();
  const q = G.fila[G.i];
  const dots = G.fila.map((_, i) => `<i class="${i < G.res.length ? (G.res[i] ? 'ok' : 'no') : i === G.i ? 'cur' : ''}"></i>`).join('');
  p.innerHTML = cabecalho() +
    `<div class="prog">${dots}</div>
     <div class="qnum">Questão ${G.i + 1} de ${G.fila.length}${G.tipo === 'simulado' ? ' · ' + sala(q.sala).materia : ''}</div>
     <h2>${q.q}</h2>
     <div id="ops">${q.o.map((t, i) => `<button class="opt" data-i="${i}"><span class="l">${'ABCD'[i]}</span><span>${t}</span></button>`).join('')}</div>
     <div class="exp" id="exp"></div>
     <div class="acoes"><button class="btn" id="sairQuiz">${G.tipo === 'sala' ? '← Voltar à sala' : 'Sair'}</button><button class="btn pri" id="prox" disabled>Responder</button></div>`;
  p.querySelectorAll('.opt').forEach(b => b.onclick = () => responder(+b.dataset.i));
  $('sairQuiz').onclick = () => G.tipo === 'sala' ? menuSala(G.sala) : campus();
  p.classList.add('on');
  p.scrollTop = 0;
}

function responder(i) {
  const q = G.fila[G.i];
  if (G.res.length > G.i) return;
  const certa = i === q.a;
  G.res.push(certa);
  const ops = [...document.querySelectorAll('#ops .opt')];
  ops.forEach(b => b.disabled = true);
  ops[q.a].classList.add('ok');
  if (!certa) ops[i].classList.add('no');

  D.questoes++;
  const ps = D.porSala[q.sala] || (D.porSala[q.sala] = { a:0, t:0 });
  ps.t++;
  if (certa) { ps.a++; D.seq++; D.xp += 10 + Math.min(D.seq, 5) * 2; }
  else D.seq = 0;
  if (D.questoes === 20) toast('Desafio concluído: 20 questões na semana! 🎉');
  salvar(); atualizarHud();
  document.querySelector('#painel .xp').innerHTML = `<b>${D.xp} XP</b>sequência ${D.seq}`;

  const e = $('exp');
  e.innerHTML = `<b style="color:${certa ? 'var(--accent)' : 'var(--bad)'}">${certa ? 'Correto!' : 'Não foi dessa vez.'}</b> ${q.e}`;
  e.classList.add('on');
  const prox = $('prox');
  prox.disabled = false;
  prox.textContent = G.i + 1 < G.fila.length ? 'Próxima questão →' : 'Ver resultado';
  prox.onclick = () => { G.i++; render(); };
  prox.focus();
}

function resultado() {
  const ac = G.res.filter(Boolean).length, tot = G.res.length;
  if (G.tipo === 'sala') D.materias++; else D.simulados++;
  salvar(); atualizarHud();
  const pct = Math.round(ac / tot * 100);
  $('painel').innerHTML = cabecalho() +
    `<div class="res"><div class="big">${ac}/${tot}</div>
     <p>${pct >= 70 ? 'Excelente! Sala dominada.' : pct >= 40 ? 'Bom caminho. Revise as explicações.' : 'Vale revisar o conteúdo e tentar de novo.'}</p></div>
     <div class="acoes"><button class="btn" id="refazer">Refazer</button><button class="btn pri" id="fim">${G.tipo === 'sala' ? 'Voltar à sala' : 'Voltar ao campus'}</button></div>`;
  const g = G;
  $('refazer').onclick = () => g.tipo === 'sala' ? iniciarQuiz(g.sala) : simulado(g.titulo);
  $('fim').onclick = () => g.tipo === 'sala' ? menuSala(g.sala) : campus();
}

function progresso() {
  if (!document.body.classList.contains('zoom')) {
    camera(768, 512, 1.06);
    document.body.classList.add('zoom');
  }
  G = { tipo:'progresso' };
  const linhas = SALAS.map(s => {
    const p = D.porSala[s.id] || { a:0, t:0 };
    const pct = p.t ? Math.round(p.a / p.t * 100) : 0;
    return `<li><b>${s.materia}</b><span>${p.a}/${p.t} · ${pct}%</span><i><u style="width:${pct}%"></u></i></li>`;
  }).join('');
  $('painel').innerHTML =
    `<div class="p-top"><div class="badge">★</div><div><span class="eyebrow">Meu progresso</span><h3>Aproveitamento por matéria</h3></div>
     <div class="xp"><b>${D.xp} XP</b>sequência ${D.seq}</div></div>
     <ul class="lista-prog">${linhas}</ul>
     <div class="acoes"><button class="btn pri" onclick="campus()">Voltar ao campus</button></div>`;
  $('painel').classList.add('on');
}

// ===================== teclado =====================
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.key === 'Escape') return campus();
  const quiz = G && (G.tipo === 'sala' || G.tipo === 'simulado') && $('ops');
  if (quiz) {
    const idx = { '1':0, '2':1, '3':2, '4':3, a:0, b:1, c:2, d:3 }[k];
    if (idx !== undefined && G.res.length === G.i) { responder(idx); return; }
    if (e.key === 'Enter' && !$('prox')?.disabled && document.activeElement !== $('prox')) $('prox').click();
    return;
  }
  if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) {
    if (e.target.tagName === 'INPUT') return;
    teclas[k] = true; e.preventDefault();
  }
});
addEventListener('keyup', e => { teclas[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in teclas) teclas[k] = false; });
$('voltar').onclick = campus;
</script>
</body>
</html>
