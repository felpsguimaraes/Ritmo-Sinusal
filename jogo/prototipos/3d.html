<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SINUS · Ritmo Sinusal 3D</title>
<style>
:root{--bg:#0b1410;--panel:rgba(12,22,18,.9);--line:#1f3a2f;--accent:#4ade80;--text:#e7f5ee;--muted:#8fb3a3;--bad:#f87171}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;top:12px;left:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:240px;max-width:calc(100vw - 24px)}
.hud h1{margin:0 0 8px;font-size:14px;letter-spacing:.5px;color:var(--accent)}
.row{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin:5px 0;color:var(--muted)}
.row b{color:var(--text)}
.bar{height:8px;background:#16291f;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--muted);white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.card{background:#0f1f19;border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;padding:20px}
.sala{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
.card h2{font-size:18px;margin:6px 0 14px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;background:#132a20;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:6px 0;font-size:15px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:#14532d;border-color:var(--accent)}
.opt.no{background:#4c1d1d;border-color:var(--bad)}
.opt:disabled{cursor:default}
#exp{margin:12px 0 0;font-size:14px;color:var(--muted);min-height:20px;line-height:1.45}
#next{margin-top:14px;background:var(--accent);color:#052e16;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <h1>SINUS · Ritmo Sinusal 3D</h1>
  <div class="row"><span>Foco nesta sessão</span><b id="foco">0min</b></div>
  <div class="row"><span>Vidas</span><b id="vidas"></b></div>
  <div class="row"><span>XP</span><b id="xp">0</b></div>
  <div class="row"><span>Acertos / respostas</span><b id="placar">0 / 0</b></div>
  <div class="row"><span>Sequência</span><b id="seq">0</b></div>
  <div class="row"><span>Desafio do dia (20 questões)</span><b id="desafioTxt">0/20</b></div>
  <div class="bar"><i id="desafio"></i></div>
</div>

<div class="hint" id="hint">Setas / WASD ou toque para andar · entre numa porta para responder</div>

<div class="modal" id="modal">
  <div class="card">
    <div class="sala" id="sala"></div>
    <h2 id="pergunta"></h2>
    <div id="opts"></div>
    <div id="exp"></div>
    <button id="next">Continuar</button>
  </div>
</div>

<script>
const WORLD = { w: 1200, h: 800 };
const P = 26;            // tamanho do personagem (unidades do mundo)
const SPEED = 230;       // unidades/s
const META = 20;         // questões do desafio diário
const WALL = 70;         // altura das paredes das salas
const TILE = 40;         // resolução do heightfield do piso

const ROOMS = [
  { id:'morfo', nome:'Morfofuncional',    sub:'Anatomia · Histologia · Fisiologia', cor:'#1e3a5f', rect:[60,60,300,200],   door:[180,262,60,36] },
  { id:'patho', nome:'Patologia Geral',   sub:'Anatomia Patológica',                cor:'#4a1d3d', rect:[450,40,300,170],  door:[570,212,60,36] },
  { id:'semio', nome:'Semiologia I',      sub:'Teoria e Prática',                   cor:'#14483a', rect:[840,60,300,200],  door:[960,262,60,36] },
  { id:'farma', nome:'Farmacologia',      sub:'Fármacos e interações',              cor:'#3d3a1a', rect:[60,300,300,180],  door:[362,360,36,60] },
  { id:'mi',    nome:'Medicina Interna I',sub:'Clínica médica',                     cor:'#4a2a16', rect:[840,300,300,180], door:[802,360,36,60] },
  { id:'saude', nome:'Saúde Coletiva',    sub:'Epidemiologia · SUS',                cor:'#1f3f2c', rect:[60,560,300,200],  door:[362,620,36,60] },
  { id:'bib',   nome:'Biblioteca',        sub:'Resumos · Slides · Provas',          cor:'#2a2a44', rect:[840,560,300,200], door:[802,620,36,60] },
];

const PERGUNTAS = {
  morfo: [
    { q:'Qual é o único osso do corpo que não se articula com nenhum outro osso?', o:['Clavícula','Hioide','Escápula','Esterno'], a:1, e:'O hioide é suspenso por músculos e ligamentos; não possui articulação óssea.' },
    { q:'Qual é a unidade contrátil básica do músculo esquelético?', o:['Miofibrila','Sarcômero','Actina','Miosina'], a:1, e:'O sarcômero (entre duas linhas Z) é a unidade contrátil.' },
    { q:'Qual nervo inerva o diafragma?', o:['Vago','Frênico','Torácico longo','Intercostal'], a:1, e:'Nervo frênico (C3–C5): "C3, C4 e C5 mantêm o diafragma vivo".' },
  ],
  patho: [
    { q:'A necrose caseosa é típica de qual agente?', o:['Mycobacterium tuberculosis','Staphylococcus aureus','Candida albicans','HPV'], a:0, e:'O granuloma caseoso da tuberculose é o exemplo clássico de necrose caseosa.' },
    { q:'Qual alteração celular é reversível?', o:['Necrose coagulativa','Apoptose','Tumefação turva (degeneração hidrópica)','Calcificação distrófica'], a:2, e:'Na lesão reversível a célula se recupera se a agressão cessar. Apoptose e necrose já são morte celular.' },
    { q:'Qual é a célula característica do granuloma?', o:['Plasmócito','Célula epitelioide com células gigantes multinucleadas','Mastócito','Neutrófilo'], a:1, e:'Macrófagos transformados em células epitelioides, com células gigantes de Langhans.' },
  ],
  semio: [
    { q:'O sinal de Murphy sugere qual diagnóstico?', o:['Apendicite','Colecistite aguda','Pancreatite','Pielonefrite'], a:1, e:'Parada da inspiração durante a palpação do hipocôndrio direito: positivo na colecistite aguda.' },
    { q:'Dor à descompressão brusca do abdome indica:', o:['Sinal de Blumberg (irritação peritoneal)','Sinal de Lasègue','Sinal de Kernig','Sinal de Courvoisier'], a:0, e:'Blumberg positivo é sugestivo de peritonite.' },
    { q:'Pulso paradoxal (queda da PA sistólica >10 mmHg na inspiração) é típico de:', o:['Insuficiência aórtica','Tamponamento cardíaco','Estenose mitral','Miocardite'], a:1, e:'Clássico do tamponamento. Também aparece na asma grave e na DPOC.' },
  ],
  farma: [
    { q:'Antídoto da intoxicação por paracetamol:', o:['Naloxona','Flumazenil','N-acetilcisteína','Atropina'], a:2, e:'A NAC repõe a glutationa e neutraliza o metabólito tóxico NAPQI.' },
    { q:'Antídoto da intoxicação por opioides:', o:['Naloxona','Flumazenil','Protamina','Vitamina K'], a:0, e:'Antagonista opioide competitivo.' },
    { q:'Primeira escolha no choque anafilático:', o:['Difenidramina','Hidrocortisona','Adrenalina IM','Salbutamol'], a:2, e:'Adrenalina IM (face anterolateral da coxa) é a primeira linha.' },
  ],
  mi: [
    { q:'Qual critério diferencia derrame pleural exsudato de transudato?', o:['Critérios de Light','Critérios de Ranson','Escala de Glasgow','Critérios de Duke'], a:0, e:'Relações de proteína e LDH do líquido pleural e do soro.' },
    { q:'Hipotensão, ingurgitamento jugular e bulhas abafadas formam a tríade de Beck de:', o:['Tamponamento cardíaco','Embolia pulmonar','Pneumotórax hipertensivo','Dissecção aórtica'], a:0, e:'Tríade clássica do tamponamento cardíaco.' },
    { q:'Autoanticorpos altamente específicos do lúpus eritematoso sistêmico:', o:['Anti-dsDNA e anti-Smith','Fator reumatoide','Anti-CCP','ANCA'], a:0, e:'Anti-Smith tem alta especificidade; anti-dsDNA se correlaciona com atividade.' },
  ],
  saude: [
    { q:'A mortalidade infantil refere-se a óbitos de menores de:', o:['28 dias','1 ano','5 anos','10 anos'], a:1, e:'Mede óbitos antes de 1 ano de idade por mil nascidos vivos.' },
    { q:'No coeficiente de incidência, o numerador é:', o:['Casos novos no período','Total de casos existentes','População total','Óbitos'], a:0, e:'Incidência conta casos novos; prevalência conta casos existentes.' },
    { q:'Princípio do SUS que garante atendimento a todos, sem discriminação:', o:['Universalidade','Hierarquização','Descentralização','Regionalização'], a:0, e:'Universalidade, equidade e integralidade são princípios doutrinários do SUS.' },
  ],
  bib: [
    { q:'Técnica de estudo que espaça revisões ao longo do tempo chama-se:', o:['Repetição espaçada','Leitura dinâmica','Mnemônica','Sublinhado'], a:0, e:'Melhora a retenção de longo prazo (ex.: flashcards no Anki).' },
    { q:'Evocar o conteúdo da memória, sem consultar o material, é:', o:['Prática de recuperação','Copiar o resumo','Releitura','Grifar'], a:0, e:'Lembrar ativamente fortalece o aprendizado mais do que reler.' },
  ],
};

const SAVE = 'sinus-ritmo-3d-v1';
const HOJE = new Date().toDateString();
const S = { x: 587, y: 690, target: null, xp: 0, acertos: 0, total: 0, seq: 0, hoje: 0, vidas: 3, foco: 0, modal: false, cool: null, usadas: new Set() };
try {
  const d = JSON.parse(localStorage.getItem(SAVE) || 'null');
  if (d) {
    S.xp = d.xp || 0; S.acertos = d.acertos || 0; S.total = d.total || 0;
    if (d.dia === HOJE) S.hoje = d.hoje || 0;
  }
} catch (e) {}
function salvar() {
  try { localStorage.setItem(SAVE, JSON.stringify({ xp: S.xp, acertos: S.acertos, total: S.total, hoje: S.hoje, dia: HOJE })); } catch (e) {}
}

const $ = id => document.getElementById(id);
const cvs = $('c'), ctx = cvs.getContext('2d');

// ---------- Projeção isométrica (canvas 2D, sem WebGL) ----------
const C30 = Math.cos(Math.PI / 6);
let K = 1, OX = 0, OY = 0, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1;
  cvs.width = innerWidth * DPR;
  cvs.height = innerHeight * DPR;
  K = Math.min(cvs.width * 0.9 / (2000 * C30), cvs.height * 0.8 / 1080);
  OX = cvs.width / 2 - (600 - 400) * C30 * K;
  OY = cvs.height / 2 - 500 * K;
}
addEventListener('resize', resize);
resize();
// mundo (x,y,z) -> tela (px de dispositivo)
const proj = (x, y, z = 0) => [(x - y) * C30 * K + OX, ((x + y) * 0.5 - z) * K + OY];

// ---------- Heightfield: piso com ondulação que sai do coração ----------
function alturaChao(x, y, t) {
  const d = Math.hypot(x - 600, y - 400);
  const colina = 8 * Math.exp(-d / 120);                      // elevação em volta do hub
  const onda = 3 * Math.sin(d / 38 - t / 220) * Math.exp(-d / 300); // pulso tipo ECG
  return colina + onda;
}

// ---------- Colisão e interação (mesma lógica da versão 2D) ----------
const SOLIDOS = ROOMS.map(r => r.rect);
const sobrepoe = (x, y, w, h, [rx, ry, rw, rh]) => x < rx + rw && x + w > rx && y < ry + rh && y + h > ry;
function bateu(x, y) {
  if (x < 0 || y < 0 || x + P > WORLD.w || y + P > WORLD.h) return true;
  return SOLIDOS.some(r => sobrepoe(x, y, P, P, r));
}
function mover(dx, dy) {
  if (!bateu(S.x + dx, S.y)) S.x += dx;
  if (!bateu(S.x, S.y + dy)) S.y += dy;
}

const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  if (S.modal) {
    const bs = [...document.querySelectorAll('#opts .opt:not(:disabled)')];
    const n = Number(e.key);
    if (n >= 1 && n <= bs.length) bs[n - 1].click();
    if (k === 'enter' && $('next').style.display !== 'none') $('next').click();
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// toque/clique: desfaz a projeção isométrica para achar o ponto do mundo
cvs.addEventListener('pointerdown', e => {
  const sx = e.clientX * DPR, sy = e.clientY * DPR;
  const a = (sx - OX) / (C30 * K);   // x - y
  const b = (sy - OY) / (0.5 * K);   // x + y
  const x = (a + b) / 2, y = (b - a) / 2;
  S.target = { x: x - P / 2, y: y - P / 2 };
});

function escolher(room) {
  const lista = PERGUNTAS[room.id];
  let idxs = lista.map((_, i) => i).filter(i => !S.usadas.has(room.id + i));
  if (!idxs.length) { lista.forEach((_, i) => S.usadas.delete(room.id + i)); idxs = lista.map((_, i) => i); }
  const idx = idxs[Math.floor(Math.random() * idxs.length)];
  S.usadas.add(room.id + idx);
  return lista[idx];
}

function abrirPergunta(room) {
  S.modal = true;
  S.cool = room.id;
  const p = escolher(room);
  $('sala').textContent = room.nome + ' · ' + room.sub;
  $('pergunta').textContent = p.q;
  $('exp').textContent = '';
  $('next').style.display = 'none';
  const box = $('opts');
  box.innerHTML = '';
  p.o.forEach((texto, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = (i + 1) + ') ' + texto;
    b.onclick = () => responder(i, p, box);
    box.appendChild(b);
  });
  $('modal').classList.add('on');
}

function responder(i, p, box) {
  const btns = [...box.children];
  btns.forEach(b => b.disabled = true);
  btns[p.a].classList.add('ok');
  const certa = i === p.a;
  if (!certa) btns[i].classList.add('no');

  S.total++;
  S.hoje++;
  if (certa) { S.acertos++; S.seq++; S.xp += 10 + Math.min(S.seq, 5) * 2; }
  else { S.seq = 0; S.vidas--; }
  if (S.hoje === META) { S.xp += 50; $('hint').textContent = 'Desafio do dia concluído! +50 XP 🎉'; }

  $('exp').textContent = (certa ? 'Correto! ' : 'Não foi dessa vez. ') + p.e;
  const nx = $('next');
  nx.textContent = S.vidas > 0 ? 'Continuar' : 'Recarregar vidas e continuar';
  nx.style.display = 'inline-block';
  nx.onclick = fechar;
  salvar();
}

function fechar() {
  if (S.vidas <= 0) S.vidas = 3;
  S.modal = false;
  $('modal').classList.remove('on');
}

function update(dt) {
  if (S.modal) return;
  S.foco += dt;

  let dx = 0, dy = 0;
  if (keys.arrowleft || keys.a) dx -= 1;
  if (keys.arrowright || keys.d) dx += 1;
  if (keys.arrowup || keys.w) dy -= 1;
  if (keys.arrowdown || keys.s) dy += 1;

  if (dx || dy) S.target = null;
  if (S.target) {
    const cx = S.target.x - S.x, cy = S.target.y - S.y, d = Math.hypot(cx, cy);
    if (d < 4) S.target = null;
    else { dx = cx / d; dy = cy / d; }
  }
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }

  const antes = S.x + S.y;
  mover(dx * SPEED * dt, dy * SPEED * dt);
  if (S.target && Math.abs(S.x + S.y - antes) < 0.01) S.target = null;

  const alvo = ROOMS.find(r => sobrepoe(S.x, S.y, P, P, r.door));
  if (alvo) { if (S.cool !== alvo.id) abrirPergunta(alvo); }
  else S.cool = null;
}

function fmt(seg) {
  const m = Math.floor(seg / 60);
  return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'min' : m + 'min';
}

function atualizarHud() {
  $('foco').textContent = fmt(S.foco);
  $('vidas').textContent = '♥'.repeat(S.vidas) + '♡'.repeat(Math.max(0, 3 - S.vidas));
  $('xp').textContent = S.xp;
  $('placar').textContent = S.acertos + ' / ' + S.total;
  $('seq').textContent = S.seq;
  $('desafioTxt').textContent = Math.min(S.hoje, META) + '/' + META;
  $('desafio').style.width = Math.min(S.hoje / META, 1) * 100 + '%';
}

// ---------- Desenho 3D ----------
function poligono(pts, cor) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
  ctx.fillStyle = cor;
  ctx.fill();
}
// multiplica a cor hex por um fator de luz (faces com sombra diferente)
function tom(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.min(255, Math.round(v * f)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function desenharChao(t) {
  ctx.lineWidth = 1;
  for (let gx = 0; gx < WORLD.w; gx += TILE) {
    for (let gy = 0; gy < WORLD.h; gy += TILE) {
      const cx = gx + TILE / 2, cy = gy + TILE / 2;
      if (ROOMS.some(r => cx > r.rect[0] && cx < r.rect[0] + r.rect[2] && cy > r.rect[1] && cy < r.rect[1] + r.rect[3])) continue;
      const z00 = alturaChao(gx, gy, t), z10 = alturaChao(gx + TILE, gy, t);
      const z11 = alturaChao(gx + TILE, gy + TILE, t), z01 = alturaChao(gx, gy + TILE, t);
      const zm = (z00 + z10 + z11 + z01) / 4;
      const L = Math.min(96, 84 + zm * 1.2);
      const pts = [proj(gx, gy, z00), proj(gx + TILE, gy, z10), proj(gx + TILE, gy + TILE, z11), proj(gx, gy + TILE, z01)];
      poligono(pts, `hsl(150,18%,${L}%)`);
      ctx.strokeStyle = 'rgba(120,160,140,.35)';
      ctx.stroke();
    }
  }
  // portas: faixas luminosas no piso
  ROOMS.forEach(r => {
    const [dx, dy, dw, dh] = r.door;
    const z = alturaChao(dx + dw / 2, dy + dh / 2, t) + 0.5;
    const pts = [proj(dx, dy, z), proj(dx + dw, dy, z), proj(dx + dw, dy + dh, z), proj(dx, dy + dh, z)];
    poligono(pts, S.cool === r.id ? 'rgba(255,255,255,.35)' : 'rgba(74,222,128,.7)');
  });
}

function desenharSala(r) {
  const [x, y, w, h] = r.rect;
  // faces visíveis: lado +x (direita), lado +y (frente) e topo
  poligono([proj(x + w, y, 0), proj(x + w, y + h, 0), proj(x + w, y + h, WALL), proj(x + w, y, WALL)], tom(r.cor, 0.7));
  poligono([proj(x, y + h, 0), proj(x + w, y + h, 0), proj(x + w, y + h, WALL), proj(x, y + h, WALL)], tom(r.cor, 0.5));
  poligono([proj(x, y, WALL), proj(x + w, y, WALL), proj(x + w, y + h, WALL), proj(x, y + h, WALL)], tom(r.cor, 1.25));

  // mesa de atendimento (caixa baixa)
  const mx = x + w / 2, my = y + h / 2, mw = 50, mh = 14, mz = 26;
  poligono([proj(mx + mw, my - mh, 0), proj(mx + mw, my + mh, 0), proj(mx + mw, my + mh, mz), proj(mx + mw, my - mh, mz)], 'rgba(0,0,0,.35)');
  poligono([proj(mx - mw, my + mh, 0), proj(mx + mw, my + mh, 0), proj(mx + mw, my + mh, mz), proj(mx - mw, my + mh, mz)], 'rgba(0,0,0,.25)');
  poligono([proj(mx - mw, my - mh, mz), proj(mx + mw, my - mh, mz), proj(mx + mw, my + mh, mz), proj(mx - mw, my + mh, mz)], 'rgba(255,255,255,.3)');

  // rótulo no topo
  const [tx, ty] = proj(x + 24, y + 40, WALL);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${Math.round(15 * DPR)}px system-ui`;
  ctx.fillText(r.nome, tx, ty);
  ctx.font = `${Math.round(12 * DPR)}px system-ui`;
  ctx.fillStyle = '#cbd5e1';
  ctx.fillText(r.sub, tx, ty + 18 * DPR);
}

function desenharCoracao(t) {
  const pulso = 1 + Math.sin(t / 400) * 0.05;
  const base = [];
  for (let i = 0; i < 32; i++) {
    const a = i / 32 * Math.PI * 2;
    const x = 600 + Math.cos(a) * 55, y = 400 + Math.sin(a) * 55;
    base.push(proj(x, y, alturaChao(x, y, t) + 2));
  }
  poligono(base, '#16a34a');

  const [bx, by] = proj(600, 400, 2);
  const [tx, ty] = proj(600, 400, 70 * pulso);
  ctx.strokeStyle = 'rgba(74,222,128,.7)';
  ctx.lineWidth = 10 * K;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke();

  const r = 60 * K * pulso;
  const g = ctx.createRadialGradient(tx, ty, 2, tx, ty, r);
  g.addColorStop(0, '#eafff1');
  g.addColorStop(0.4, 'rgba(74,222,128,.85)');
  g.addColorStop(1, 'rgba(74,222,128,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2); ctx.fill();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#166534';
  ctx.font = `bold ${Math.round(14 * DPR)}px system-ui`;
  const [lx, ly] = proj(600, 400, 0);
  ctx.fillText('SINUS', lx, ly + 36 * K);
}

function desenharJogador() {
  const [fx, fy] = proj(S.x + P / 2, S.y + P / 2, 0);
  const s = 1.6 * K;
  // sombra no chão
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(fx, fy, 9 * s, 4 * s, 0, 0, Math.PI * 2); ctx.fill();
  // pernas
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(fx - 5 * s, fy - 6 * s, 4 * s, 6 * s);
  ctx.fillRect(fx + 1 * s, fy - 6 * s, 4 * s, 6 * s);
  // jaleco com faixa verde
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(fx - 7 * s, fy - 22 * s, 14 * s, 17 * s);
  ctx.fillStyle = '#4ade80';
  ctx.fillRect(fx - 1 * s, fy - 22 * s, 2 * s, 17 * s);
  // cabeça
  ctx.fillStyle = '#f1c9a5';
  ctx.beginPath(); ctx.arc(fx, fy - 27 * s, 6 * s, 0, Math.PI * 2); ctx.fill();
}

function desenhar(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b1410';
  ctx.fillRect(0, 0, cvs.width, cvs.height);

  desenharChao(t);

  // ordenação por profundidade (pintor): salas, coração e personagem
  const itens = [
    ...ROOMS.map(r => ({ k: r.rect[0] + r.rect[2] / 2 + r.rect[1] + r.rect[3] / 2, fn: () => desenharSala(r) })),
    { k: 1000, fn: () => desenharCoracao(t) },
    { k: S.x + S.y + P, fn: () => desenharJogador() },
  ].sort((a, b) => a.k - b.k);
  itens.forEach(i => i.fn());
}

let ultimo = performance.now();
function loop(t) {
  const dt = Math.min((t - ultimo) / 1000, 0.05);
  ultimo = t;
  update(dt);
  desenhar(t);
  atualizarHud();
  requestAnimationFrame(loop);
}
atualizarHud();
requestAnimationFrame(loop);
</script>
</body>
