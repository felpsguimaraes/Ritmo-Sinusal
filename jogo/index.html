<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SINUS · Campus</title>
<meta name="description" content="Campus SINUS: entre nas salas das matérias, estude com foco cronometrado, playlist e sons de hospital.">
<meta name="theme-color" content="#07110e">
<meta property="og:title" content="SINUS · Campus">
<meta property="og:description" content="Entre nas salas das matérias e estude com foco cronometrado.">
<meta property="og:image" content="https://meusinus.pages.dev/jogo/assets/sinus-campus-vazio.jpg">
<link rel="icon" href="/favicon.svg?v=20261024" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07110e;--glass:rgba(9,19,17,.92);--line:rgba(255,255,255,.09);
  --accent:#4ade80;--accent-soft:rgba(74,222,128,.16);--teal:#5eead4;
  --text:#f1f7f4;--muted:#9fb3ab;--bad:#f87171;
  --ease:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}

/* ---------- palco: a arte original em 1536x1024, escalada para caber ---------- */
/* moldura fixa: impede o celular de alargar a página por causa do palco de 1536px */
#tela{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1536px;height:1024px;transform:translate(-50%,-50%) scale(var(--fit,1));overflow:hidden;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#cam{position:absolute;inset:0;transform-origin:0 0;will-change:transform;--inv:1}
#cam img.arte{position:absolute;inset:0;width:1536px;height:1024px;display:block;user-select:none;-webkit-user-drag:none}
#veu{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 30% 50%,transparent 30%,rgba(3,8,6,.5) 70%),linear-gradient(90deg,transparent 45%,rgba(3,8,6,.55));opacity:0;transition:opacity .9s}
body.esq #veu{background:radial-gradient(ellipse at 70% 50%,transparent 30%,rgba(3,8,6,.5) 70%),linear-gradient(270deg,transparent 45%,rgba(3,8,6,.55))}
body.zoom #veu{opacity:1}
body.zoom .hud-hit,body.zoom .live,body.zoom #piso{pointer-events:none}

/* ---------- efeitos vivos sobre a arte ---------- */
svg#fx{position:absolute;inset:0;width:1536px;height:1024px;overflow:visible}
#piso{fill:transparent;cursor:pointer}
.sala-hit{fill:rgba(74,222,128,0);stroke:transparent;stroke-width:3;cursor:pointer;transition:fill .25s,stroke .25s,filter .25s}
.sala-hit:hover,.sala-hit.on{fill:rgba(74,222,128,.10);stroke:#4ade80;filter:drop-shadow(0 0 10px rgba(74,222,128,.9))}
body.zoom .sala-hit{pointer-events:none;stroke:transparent;fill:transparent}
.sala-hit:focus{outline:none}
.sala-hit:focus-visible{stroke:#4ade80;fill:rgba(74,222,128,.10)}
.ecg{fill:none;stroke:#86efac;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60 400;animation:ecg 2.4s linear infinite;filter:drop-shadow(0 0 6px #4ade80)}
@keyframes ecg{from{stroke-dashoffset:460}to{stroke-dashoffset:0}}
.halo{transform-origin:783px 455px;animation:halo 1.2s ease-in-out infinite;mix-blend-mode:screen}
@keyframes halo{0%,100%{opacity:.35;transform:scale(.94)}15%{opacity:.85;transform:scale(1.06)}30%{opacity:.45;transform:scale(.98)}45%{opacity:.75;transform:scale(1.03)}}
.part{fill:#a7f3d0;mix-blend-mode:screen;animation:sobe 5s linear infinite}
@keyframes sobe{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-150px);opacity:0}}
.chev{animation:chev 1.6s ease-in-out infinite;mix-blend-mode:screen}
@keyframes chev{0%,100%{opacity:.15}50%{opacity:.9}}
.destino{fill:none;stroke:#86efac;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.destino.on{animation:destino .9s ease-out}
@keyframes destino{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
.porta{fill:#4ade80;opacity:0;mix-blend-mode:screen;transition:opacity .3s}
.porta.on{opacity:.55;animation:porta 1s ease-in-out infinite}
@keyframes porta{50%{opacity:.25}}
/* escurece o campus fora da sala quando se está dentro dela */
#mascara{fill:rgba(2,8,6,.72);fill-rule:evenodd;opacity:0;transition:opacity .8s;pointer-events:none}
body.interior #mascara{opacity:1}

/* ---------- placas das salas reescritas com as matérias do 5º semestre ---------- */
.placa{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));display:flex;flex-direction:column;justify-content:center;padding:0 6px;border-radius:9px;background:linear-gradient(180deg,#1c272e,#162128);box-shadow:0 0 5px 3px #19242b;color:#f6f8f8;pointer-events:none;white-space:nowrap;overflow:hidden}
.arte-txt{position:absolute;display:flex;align-items:center;padding:0 3px;white-space:nowrap;pointer-events:none;letter-spacing:-.1px;font-family:Inter,system-ui,sans-serif}
.placa b{display:block;width:max-content;font-weight:800;letter-spacing:-.2px;line-height:1.05}
.placa small{display:block;width:max-content;font-weight:500;color:#dfe7e9;margin-top:3px;line-height:1.05}

/* ---------- objetos dentro das salas ---------- */
.objs{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.objs.on{opacity:1}
.objs.on .obj{pointer-events:auto}
.obj{position:absolute;width:0;height:0;border:0;padding:0;background:none;cursor:pointer}
.obj .marca{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;transform:translate(-14px,-50%) scale(var(--inv));transform-origin:14px 50%;white-space:nowrap}
.obj .pino{position:relative;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(8,20,15,.9);border:2px solid var(--accent);color:var(--accent);font-size:13px;font-weight:700;box-shadow:0 0 14px rgba(74,222,128,.65)}
.obj .pino::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(74,222,128,.6);animation:pulsa 1.8s ease-out infinite}
@keyframes pulsa{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
.obj .rot{padding:4px 9px;border-radius:999px;background:rgba(8,16,13,.88);border:1px solid rgba(255,255,255,.14);font-size:12px;font-weight:600;color:#e7f5ee}
.obj:hover .rot,.obj:focus-visible .rot{border-color:var(--accent);color:var(--accent)}
.obj:focus{outline:none}
.obj.ativo .pino{background:var(--accent);color:#052e16}

/* ---------- personagem ---------- */
#player{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;transition:opacity .35s}
#player .corpo{position:absolute;left:0;top:0;transform-origin:50% 100%}
#player .vira{transform-origin:50% 100%;transition:transform .2s}
#player.esq .vira{transform:scaleX(-1)}
#player img{display:block;width:66px;height:135px;transform-origin:50% 100%}
#player.andando img{animation:passo .38s ease-in-out infinite}
@keyframes passo{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4px) rotate(-1.6deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-4px) rotate(1.6deg)}}
#player .sombra,#player .luz{position:absolute;left:0;top:0;border-radius:50%}
#player .sombra{width:72px;height:22px;margin:-11px 0 0 -36px;background:radial-gradient(closest-side,rgba(20,30,25,.45),rgba(20,30,25,0))}
#player .luz{width:96px;height:30px;margin:-15px 0 0 -48px;background:radial-gradient(closest-side,rgba(134,239,172,.75),rgba(34,197,94,0));mix-blend-mode:screen;animation:luz 2s ease-in-out infinite}
@keyframes luz{50%{opacity:.35}}
#player.saindo{opacity:0}

/* ---------- áreas clicáveis da interface desenhada ---------- */
.hud-hit{position:absolute;border:0;background:transparent;border-radius:12px;cursor:pointer;transition:background .2s,box-shadow .2s}
.hud-hit:hover{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.hud-hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hud-hit.redondo{border-radius:50%}

/* ---------- valores ao vivo pintados por cima da arte ---------- */
.live{position:absolute;pointer-events:none}
.foco-txt{left:98px;top:234px;width:94px;height:50px;background:linear-gradient(90deg,#0e1a1e,#1f2523 70%,#242522);padding:4px 0 0 5px}
.foco-txt b{display:block;font-size:19px;font-weight:700;letter-spacing:-.2px;color:#fff;line-height:22px}
.foco-txt small{display:block;font-size:13.5px;color:#c3cdc9;margin-top:2px}
.anel{left:23px;top:219px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle,#0e1c20 62%,rgba(14,28,32,0) 72%)}
.num{width:52px;height:20px;background:#0c1a21;font-size:13.5px;color:#cfd8da;text-align:right;line-height:20px;padding-right:4px}
.barra{left:68px;width:194px;height:14px;background:#0c1a21;padding:3px 4px}
.barra i{display:block;height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.barra i u{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#6ee7b7,#4ade80);transition:width .6s var(--ease)}
.ico{width:28px;height:28px;border-radius:50%;background:#0c1a21;display:grid;place-items:center}

/* ---------- painel (fora do palco, sempre nítido) ---------- */
#painel{position:fixed;top:50%;right:clamp(12px,3vw,48px);width:min(460px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow:auto;transform:translate(30px,-50%);opacity:0;pointer-events:none;transition:opacity .45s,transform .45s var(--ease);background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:22px;backdrop-filter:blur(16px);box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:20}
#painel.on{opacity:1;transform:translate(0,-50%);pointer-events:auto}
body.esq #painel{right:auto;left:clamp(12px,3vw,48px);transform:translate(-30px,-50%)}
body.esq #painel.on{transform:translate(0,-50%)}
.p-top{display:flex;align-items:center;gap:12px}
.badge{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--accent);background:rgba(74,222,128,.08);flex:none;box-shadow:0 0 18px rgba(74,222,128,.35)}
.p-top h3{margin:0;font-size:19px;font-weight:700;line-height:1.2;text-wrap:balance}
.p-top small{color:var(--muted);font-size:13px}
.xp{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.xp b{display:block;font-size:16px;color:var(--accent)}
.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.prof{margin:14px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.prof b{color:#dbe7e1;font-weight:600}
.dica{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:rgba(74,222,128,.07);border:1px dashed rgba(74,222,128,.35);font-size:13px;color:#cfe9da;line-height:1.45}
.modo{display:flex;gap:4px;margin:16px 0 4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.modo button{flex:1;padding:9px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.modo button.on{background:var(--accent-soft);color:var(--accent)}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.acao{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);text-decoration:none;cursor:pointer;text-align:left;min-width:0;transition:border-color .2s,background .2s,transform .15s}
.acao:hover{border-color:rgba(74,222,128,.6);background:rgba(74,222,128,.06);transform:translateY(-1px)}
.acao:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acao .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:15px}
.acao b{font-size:13.5px;font-weight:600;line-height:1.25}
.acao small{font-size:11.5px;color:var(--muted);line-height:1.3}
.acao.destaque{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(74,222,128,.16),rgba(94,234,212,.06));border-color:rgba(74,222,128,.45)}
.acao.destaque .ic{background:var(--accent);color:#052e16}
.nota{margin:14px 0 0;font-size:12px;color:var(--muted)}
.cartao{margin-top:16px;padding:16px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.cartao .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:22px}
.cartao h4{margin:12px 0 4px;font-size:18px}
.cartao p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.prog{display:flex;gap:6px;margin:18px 0 6px}
.prog i{flex:1;height:5px;border-radius:4px;background:rgba(255,255,255,.1)}
.prog i.ok{background:var(--accent)}.prog i.no{background:var(--bad)}.prog i.cur{background:var(--teal)}
.caso{margin:10px 0 0;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border-left:3px solid var(--teal);font-size:14px;line-height:1.5;color:#d5e4df}
.figura{display:block;margin:10px 0 0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.figura img{display:block;width:100%;max-height:240px;object-fit:contain}
.fonte{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
.qnum{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:12px}
#painel h2{font-size:18px;line-height:1.4;margin:8px 0 16px;font-weight:600}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:15px;line-height:1.35;cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
.opt:hover:not(:disabled){border-color:rgba(74,222,128,.6);background:rgba(74,222,128,.06);transform:translateX(2px)}
.opt .l{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:12px;font-weight:700;flex:none}
.opt.ok{border-color:var(--accent);background:rgba(34,197,94,.16)}.opt.ok .l{background:var(--accent);color:#052e16}
.opt.no{border-color:var(--bad);background:rgba(248,113,113,.12)}.opt.no .l{background:var(--bad);color:#450a0a}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(94,234,212,.07);border:1px solid rgba(94,234,212,.2);font-size:14px;line-height:1.5;color:#d5e4df;display:none}
.exp.on{display:block}
.acoes{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:600;cursor:pointer;text-align:center;text-decoration:none;font-size:15px}
.btn.pri{border:0;background:linear-gradient(90deg,#86efac,#4ade80);color:#052e16;box-shadow:0 8px 24px rgba(74,222,128,.3)}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:10px 0}
.res .big{font-size:46px;font-weight:800;color:var(--accent);line-height:1}
.res p{color:var(--muted);margin:8px 0 0}
.lista-prog{list-style:none;padding:0;margin:16px 0 0}
.lista-prog li{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.lista-prog li span{color:var(--muted)}
.lista-prog li i{grid-column:1/3;height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.lista-prog li i u{display:block;height:100%;background:linear-gradient(90deg,#6ee7b7,#4ade80)}

#voltar{position:fixed;left:clamp(12px,2vw,28px);top:clamp(12px,2vw,24px);z-index:21;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);font-weight:600;font-size:14px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
body.zoom #voltar{opacity:1;pointer-events:auto}
body.esq #voltar{left:auto;right:clamp(12px,2vw,28px)}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);opacity:0;z-index:30;padding:10px 18px;border-radius:999px;background:var(--glass);border:1px solid rgba(74,222,128,.4);font-size:14px;transition:opacity .3s,transform .3s var(--ease);pointer-events:none;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#tip{position:absolute;padding:7px 12px;border-radius:999px;background:rgba(8,16,13,.92);border:1px solid rgba(74,222,128,.5);font-size:13px;font-weight:600;color:var(--accent);pointer-events:none;opacity:0;transform:translate(-50%,-100%) scale(var(--inv,1));transition:opacity .2s;white-space:nowrap}
#tip.on{opacity:1}

/* ---------- doca: sessão de estudo + playlist ---------- */
#doca{position:fixed;right:clamp(10px,1.6vw,22px);bottom:clamp(10px,1.6vw,22px);z-index:25;display:flex;flex-direction:column;align-items:flex-end;gap:8px;width:min(320px,calc(100vw - 20px))}
body.zoom:not(.esq) #doca{right:auto;left:clamp(10px,1.6vw,22px);align-items:flex-start}
.dock{width:100%;background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
#estudo{display:none;padding:12px 14px;border-color:rgba(74,222,128,.45)}
#estudo.on{display:block}
#estudo .linha{display:flex;align-items:center;gap:10px}
#estudo .ponto{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:luz 1.4s ease-in-out infinite;flex:none}
#estudo .info{min-width:0;flex:1}
#estudo .info small{display:block;font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
#estudo .info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#estudo .tempo{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
#estudo .pomo{margin-top:10px;height:5px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
#estudo .pomo u{display:block;height:100%;width:0;background:linear-gradient(90deg,#5eead4,#4ade80)}
#estudo .bts{display:flex;gap:8px;margin-top:10px}
#estudo .bts button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:13px;font-weight:600;cursor:pointer}
#musica{padding:10px 12px}
#musica .linha{display:flex;align-items:center;gap:10px}
#musica .capa{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#14532d,#0f766e);color:#bbf7d0;font-size:17px;flex:none}
#musica .capa.tocando{animation:capa 2.4s ease-in-out infinite}
@keyframes capa{50%{box-shadow:0 0 18px rgba(74,222,128,.7)}}
#musica .info{min-width:0;flex:1}
#musica .info small{display:block;font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
#musica .info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbt{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;display:grid;place-items:center;font-size:13px;flex:none}
.mbt.play{background:var(--accent);color:#052e16;border:0}
.mbt[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
.idiomas{display:flex;gap:4px;margin:2px 0 10px}
.idiomas button{flex:1;padding:6px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.idiomas button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#musica .extra{display:none;margin-top:10px}
#musica.aberto .extra{display:block}
#musica input[type=range]{width:100%;accent-color:#4ade80}
#musica ol{list-style:none;margin:8px 0 0;padding:0}
#musica li button{width:100%;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:13px;cursor:pointer}
#musica li button:hover{background:rgba(255,255,255,.05)}
#musica li button.on{background:var(--accent-soft);color:var(--accent)}

function encaixar() {

const CAM = { cx:768, cy:512, z:1, ax:768, ay:512 }, ALVO = { ...CAM };
function limitar(cx, cy, z, ax, ay) {
  return [Math.min(Math.max(cx, ax / z), 1536 - (1536 - ax) / z), Math.min(Math.max(cy, ay / z), 1024 - (1024 - ay) / z)];
}
function camera(cx = 768, cy = 512, z = 1, ax = 768, ay = 512) { Object.assign(ALVO, { cx, cy, z, ax, ay }); }
function aplicarCamera(dt) {
  const k = 1 - Math.exp(-dt * 4.2);
  for (const f in CAM) CAM[f] += (ALVO[f] - CAM[f]) * k;
  const [cx, cy] = limitar(CAM.cx, CAM.cy, CAM.z, CAM.ax, CAM.ay);
  cam.style.transform = `translate(${CAM.ax}px,${CAM.ay}px) scale(${CAM.z}) translate(${-cx}px,${-cy}px)`;
  cam.style.setProperty('--inv', (1 / CAM.z).toFixed(3));
}

function caixa(poly) {
  const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  return { x0, x1, y0, y1, cx:(x0 + x1) / 2, cy:(y0 + y1) / 2, w:x1 - x0, h:y1 - y0 };
}
function focar(sala) {
  const b = caixa(sala.poly);
  const estreito = innerWidth < 760;
  const esq = !estreito && b.cx > 768; // painel do lado oposto à sala
  document.body.classList.toggle('esq', esq);
  const ax = estreito ? 768 : 1536 * (esq ? 0.68 : 0.32), ay = estreito ? 1024 * 0.27 : 512;
  const [l0, l1] = estreito ? [0, 1536] : esq ? [1536 * 0.36, 1536] : [0, 1536 * 0.64];
  let z = Math.min(estreito ? innerWidth / FIT / b.w * 0.95 : 1536 * 0.58 / b.w, 1024 * (estreito ? 0.45 : 0.86) / b.h, 2.4);
  while (z > 1.05) {
    const [cx] = limitar(b.cx, b.cy, z, ax, ay);
    if (ax + z * (b.x1 - cx) <= l1 && ax + z * (b.x0 - cx) >= l0) break;
    z -= 0.05;
  }
  camera(b.cx, b.cy, z, ax, ay);
  document.body.classList.add('zoom');
}

const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function pontoNoSegmento(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;
  const t = L ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L)) : 0;
  return [a[0] + t * dx, a[1] + t * dy];
}
function arestaMaisProxima(p) {
  let melhor = null;
  ARESTAS.forEach(([u, v]) => {
    const q = pontoNoSegmento(p, NOS[u], NOS[v]), d = dist(p, q);
    if (!melhor || d < melhor.d) melhor = { u, v, q, d };
  });
  return melhor;
}
function caminho(de, ate) {
  const d = {}, ant = {}, aberto = new Set(Object.keys(NOS));
  Object.keys(NOS).forEach(k => d[k] = Infinity); d[de] = 0;
  while (aberto.size) {
    let u = null; aberto.forEach(k => { if (u === null || d[k] < d[u]) u = k; });
    aberto.delete(u);
    if (u === ate) break;
    ARESTAS.forEach(([a, b]) => {
      const v = a === u ? b : b === u ? a : null;
      if (!v || !aberto.has(v)) return;
      const nd = d[u] + dist(NOS[u], NOS[v]);
      if (nd < d[v]) { d[v] = nd; ant[v] = u; }

}
function rotaAte(alvo) {

  let melhor = null;
  [de.u, de.v].forEach(a => [para.u, para.v].forEach(b => {

// ===================== laço principal =====================
const teclas = {};
let ultimo = performance.now(), ultimoPasso = 0;
function passo(t) {
  const dt = Math.min((t - ultimo) / 1000, 0.05); ultimo = t;
  let andando = false;
  if (MODO === 'campus') {
    let dx = (teclas.arrowright || teclas.d ? 1 : 0) - (teclas.arrowleft || teclas.a ? 1 : 0);
    let dy = (teclas.arrowdown || teclas.s ? 1 : 0) - (teclas.arrowup || teclas.w ? 1 : 0);
    if (dx || dy) {
      P.rota = []; P.aoChegar = null;
      const n = Math.hypot(dx, dy), nx = P.x + dx / n * VEL * dt, ny = P.y + dy / n * VEL * dt;
      const a = arestaMaisProxima([nx, ny]);
      const [qx, qy] = a.d <= 24 ? [nx, ny] : a.q; // desliza pelo caminho em vez de travar
      if (dx) player.classList.toggle('esq', dx < 0);
      P.x = qx; P.y = qy; andando = true;
      const s = SALAS.find(s => dist([P.x, P.y], NOS[s.no]) < 14);
      if (s) entrarNaSala(s);
    }
  }
  if (!andando && P.rota.length) {
    const alvo = P.rota[0], d = dist([P.x, P.y], alvo), passoLen = (MODO === 'sala' ? 150 : VEL) * dt;
    if (Math.abs(alvo[0] - P.x) > 2) player.classList.toggle('esq', alvo[0] < P.x);
    if (d <= passoLen) { P.x = alvo[0]; P.y = alvo[1]; P.rota.shift(); }
    else { P.x += (alvo[0] - P.x) / d * passoLen; P.y += (alvo[1] - P.y) / d * passoLen; }
    andando = true;
    if (!P.rota.length && P.aoChegar) { const f = P.aoChegar; P.aoChegar = null; f(); }
  }
  // câmera: zoom acompanhando a estudante enquanto ela anda pelo campus
  if (MODO === 'campus') {
    if (andando) { P.parado = 0; camera(P.x, P.y - 70, innerWidth < 760 ? 2.2 : 1.75); }
    else if ((P.parado += dt) > 1.4) camera();
  }
  player.classList.toggle('andando', andando);
  if (andando && t - ultimoPasso > 380) { ultimoPasso = t; efeito('passo'); }
  desenharPlayer();
  aplicarCamera(dt);
  requestAnimationFrame(passo);
}

function encerrarEstudo(silencioso) {

  salvar(); atualizarEstudo(); atualizarHud();
  if (!silencioso) toast(L(`Sessão registrada: ${Math.round(seg / 60)} min de foco`,`Sesión registrada: ${Math.round(seg / 60)} min de foco`,`Session saved: ${Math.round(seg / 60)} min of focus`));
}
const hms = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); };
function atualizarEstudo() {

}

const USADAS = {};
function sortear(lista, n, chave) {
  const usadas = USADAS[chave] || (USADAS[chave] = new Set());
  let livres = lista.filter(q => !usadas.has(q.id));
  if (livres.length < n) { usadas.clear(); livres = lista; }
  const fila = embaralhar(livres).slice(0, n);
  fila.forEach(q => usadas.add(q.id));
  return fila;
}

// ===================== playlist de estudo (som gerado no navegador) =====================
// Nenhum arquivo de áudio: cada faixa é sintetizada com Web Audio, sem direitos autorais.
const AUD = { ctx:null, master:null, parar:null, tocando:false };
function ctxAudio() {
  if (!AUD.ctx) {
    AUD.ctx = new (window.AudioContext || window.webkitAudioContext)();
    AUD.master = AUD.ctx.createGain();
    AUD.master.gain.value = D.volume;
    AUD.master.connect(AUD.ctx.destination);
  }
  if (AUD.ctx.state === 'suspended') AUD.ctx.resume();
  return AUD.ctx;
}
const BUF = {};
function ruido(tipo) {
  if (BUF[tipo]) return BUF[tipo];
  const c = ctxAudio(), n = c.sampleRate * 4, b = c.createBuffer(2, n, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch);
    let last = 0, b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      if (tipo === 'marrom') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
      else if (tipo === 'rosa') { b0 = 0.997 * b0 + w * 0.029591; b1 = 0.985 * b1 + w * 0.032534; b2 = 0.95 * b2 + w * 0.048056; d[i] = (b0 + b1 + b2 + w * 0.0157) * 0.55; }
      else if (tipo === 'vinil') d[i] = (Math.random() < 0.0006 ? (Math.random() - .5) * 0.9 : 0) + w * 0.004;
      else d[i] = w;
    }
  }
  return BUF[tipo] = b;
}
function fonteRuido(tipo, destino, ganho) {
  const c = AUD.ctx, s = c.createBufferSource(), g = c.createGain();
  s.buffer = ruido(tipo); s.loop = true; g.gain.value = ganho;
  s.connect(g); g.connect(destino); s.start();
  return s;
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function nota(destino, m, t, dur, tipo = 'sine', vol = 0.12, ataque = 0.02) {
  const c = AUD.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = tipo; o.frequency.value = hz(m);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + ataque);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(destino); o.start(t); o.stop(t + dur + 0.05);
}
function batida(destino, t, tipo) {
  const c = AUD.ctx;
  if (tipo === 'bumbo') {
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    g.gain.setValueAtTime(0.55, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(destino); o.start(t); o.stop(t + 0.35);
  } else {
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = ruido('branco');
    f.type = tipo === 'caixa' ? 'bandpass' : 'highpass'; f.frequency.value = tipo === 'caixa' ? 1800 : 7500;
    const v = tipo === 'caixa' ? 0.16 : 0.035, d = tipo === 'caixa' ? 0.18 : 0.05;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    s.connect(f); f.connect(g); g.connect(destino); s.start(t, Math.random() * 3); s.stop(t + d + 0.02);
  }
}
// agenda notas um pouco à frente do tempo atual
function agendador(cada, fn) {
  const c = AUD.ctx; let prox = c.currentTime + 0.1, passo = 0;
  const id = setInterval(() => { while (prox < c.currentTime + 0.25) { fn(passo++, prox); prox += cada; } }, 40);
  return () => clearInterval(id);
}

// ambiente de hospital: tom da sala, ventilação, monitor cardíaco e chamadas no alto-falante
function hospital(out, nivel) {
  const c = AUD.ctx, paradas = [];
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380; lp.connect(out);
  paradas.push(fonteRuido('marrom', lp, 0.35 * nivel));
  const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2600; hp.connect(out);
  paradas.push(fonteRuido('rosa', hp, 0.05 * nivel));
  // ventilação "respirando" devagar
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 0.8;
  const resp = c.createGain(); resp.gain.value = 0.22 * nivel; bp.connect(resp); resp.connect(out);
  paradas.push(fonteRuido('rosa', bp, 1));
  const lfo = c.createOscillator(), prof = c.createGain();
  lfo.frequency.value = 0.21; prof.gain.value = 0.18 * nivel; lfo.connect(prof); prof.connect(resp.gain); lfo.start();
  paradas.push(lfo);
  // monitor multiparamétrico a 72 bpm
  const pararBip = agendador(60 / 72, (p, t) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = 988;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.06 * nivel, t + 0.006);
    g.gain.setValueAtTime(0.06 * nivel, t + 0.085); g.gain.linearRampToValueAtTime(0, t + 0.12);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.14);
  });
  // chamada no alto-falante, distante e com eco
  const eco = c.createDelay(); eco.delayTime.value = 0.31; const fb = c.createGain(); fb.gain.value = 0.42;
  const sala = c.createBiquadFilter(); sala.type = 'lowpass'; sala.frequency.value = 2200;
  eco.connect(fb); fb.connect(eco); eco.connect(sala); sala.connect(out);
  let t1;
  (function chamada() {
    t1 = setTimeout(() => {
      const t = c.currentTime + 0.05;
      nota(eco, 76, t, 1.6, 'triangle', 0.05 * nivel, 0.01);
      nota(eco, 72, t + 0.55, 2.2, 'triangle', 0.05 * nivel, 0.01);
      chamada();
    }, 22000 + Math.random() * 38000);
  })();
  return () => { paradas.forEach(n => n.stop()); pararBip(); clearTimeout(t1); };
}

// efeitos do jogo (só com os sons do hospital ligados)
function efeito(tipo) {
  if (!D.sons || !AUD.ctx) return;
  const c = AUD.ctx, t = c.currentTime + 0.01;
  if (tipo === 'porta') {
    // porta automática deslizando
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = ruido('rosa'); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(350, t); f.frequency.exponentialRampToValueAtTime(1500, t + 0.45);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.35, t + 0.12); g.gain.linearRampToValueAtTime(0, t + 0.6);
    s.connect(f); f.connect(g); g.connect(AUD.master); s.start(t); s.stop(t + 0.65);
  } else if (tipo === 'passo') {
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = ruido('branco'); f.type = 'lowpass'; f.frequency.value = 420;
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    s.connect(f); f.connect(g); g.connect(AUD.master); s.start(t, Math.random() * 3); s.stop(t + 0.08);
  } else if (tipo === 'certo') {
    nota(AUD.master, 79, t, 0.5, 'sine', 0.09, 0.005); nota(AUD.master, 84, t + 0.12, 0.7, 'sine', 0.08, 0.005);
  } else if (tipo === 'errado') {
    nota(AUD.master, 57, t, 0.18, 'square', 0.03, 0.005); nota(AUD.master, 57, t + 0.24, 0.18, 'square', 0.03, 0.005);
  }
}

const AMB = { parar:null };
function ligarSons(ligar) {

const FAIXAS = [
  { nome:L('Plantão · sons de hospital','Guardia · sonidos de hospital','On call · hospital sounds'), tipo:L('ambiente','ambiente','ambient'), criar(out) { return hospital(out, 1.3); } },

  } },
  { nome:L('Chuva na janela','Lluvia en la ventana','Rain on the window'), tipo:L('ambiente','ambiente','ambient'), criar(out) {
      const c = AUD.ctx;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
      hp.connect(lp); lp.connect(out);
      const a = fonteRuido('rosa', hp, 0.9);
      const lpg = c.createBiquadFilter(); lpg.type = 'lowpass'; lpg.frequency.value = 260; lpg.connect(out);
      const b = fonteRuido('marrom', lpg, 0.7);
      const id = setInterval(() => {
        if (Math.random() < 0.6) {
          const t = c.currentTime + Math.random() * 0.1, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
          s.buffer = ruido('branco'); f.type = 'bandpass'; f.frequency.value = 2000 + Math.random() * 3500; f.Q.value = 8;
          g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random() * 3); s.stop(t + 0.08);
        }
      }, 90);
      return () => { a.stop(); b.stop(); clearInterval(id); };
  } },
  { nome:L('Ruído marrom · foco profundo','Ruido marrón · foco profundo','Brown noise · deep focus'), tipo:L('concentração','concentración','concentration'), criar(out) {
      const c = AUD.ctx, lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650; lp.connect(out);
      const s = fonteRuido('marrom', lp, 0.9);
      return () => s.stop();
  } },
  { nome:L('Piano calmo','Piano tranquilo','Calm piano'), tipo:L('leitura','lectura','reading'), criar(out) {
      const c = AUD.ctx, eco = c.createDelay(); eco.delayTime.value = 0.38;
      const fb = c.createGain(); fb.gain.value = 0.35; eco.connect(fb); fb.connect(eco); eco.connect(out);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.connect(out); lp.connect(eco);
      const ESCALA = [60,62,64,67,69,72,74,76,79];
      let vivo = true, n = 0;
      (function toca() {
        if (!vivo) return;
        const t = c.currentTime + 0.05, m = ESCALA[Math.floor(Math.random() * ESCALA.length)];
        nota(lp, m, t, 2.8, 'sine', 0.1, 0.01); nota(lp, m + 12, t, 1.6, 'triangle', 0.02, 0.01);
        if (n++ % 8 === 0) [48, 55, 64].forEach(b => nota(lp, b, t, 5, 'sine', 0.05, 0.6));
        setTimeout(toca, 550 + Math.random() * 1000);
      })();
      return () => { vivo = false; };
  } },
  { nome:L('Ondas alfa 10 Hz','Ondas alfa 10 Hz','Alpha waves 10 Hz'), tipo:L('use fones','usa auriculares','use headphones'), criar(out) {
      const c = AUD.ctx, nos = [];
      [[200, -1], [210, 1]].forEach(([f, lado]) => {
        const o = c.createOscillator(), g = c.createGain(), p = c.createStereoPanner();
        o.frequency.value = f; g.gain.value = 0.12; p.pan.value = lado;
        o.connect(g); g.connect(p); p.connect(out); o.start(); nos.push(o);
      });
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(out);
      const r = fonteRuido('rosa', lp, 0.25);
      return () => { nos.forEach(o => o.stop()); r.stop(); };
  } },
];

function tocarFaixa(i) {
  const c = ctxAudio();
  pararFaixa();
  D.faixa = (i + FAIXAS.length) % FAIXAS.length; salvar();
  const out = c.createGain();
  out.gain.setValueAtTime(0, c.currentTime);
  out.gain.linearRampToValueAtTime(1, c.currentTime + 1.5);
  out.connect(AUD.master);
  const parar = FAIXAS[D.faixa].criar(out);
  AUD.parar = () => {
    out.gain.cancelScheduledValues(c.currentTime);
    out.gain.setValueAtTime(out.gain.value, c.currentTime);
    out.gain.linearRampToValueAtTime(0, c.currentTime + 0.6);
    setTimeout(() => { parar(); out.disconnect(); }, 700);
  };
  AUD.tocando = true;
  atualizarMusica();
}
function pararFaixa() {
  if (AUD.parar) { AUD.parar(); AUD.parar = null; }
  AUD.tocando = false;
  atualizarMusica();
}
function sino() {
  try {
    const c = ctxAudio(), t = c.currentTime;
    [[88, 0.18], [95, 0.1]].forEach(([m, v]) => nota(AUD.master, m, t, 2.2, 'sine', v, 0.01));
  } catch (e) {}
}
function atualizarMusica() {
  $('faixa').textContent = FAIXAS[D.faixa].nome;
  $('tocar').textContent = AUD.tocando ? '❚❚' : '▶';
  $('tocar').setAttribute('aria-label', AUD.tocando ? L('Pausar','Pausar','Pause') : L('Tocar','Reproducir','Play'));
  $('capa').classList.toggle('tocando', AUD.tocando);
  $('faixas').innerHTML = FAIXAS.map((f, i) => `<li><button class="${i === D.faixa ? 'on' : ''}" data-i="${i}"><span>${f.nome}</span><small>${f.tipo}</small></button></li>`).join('');
  $('faixas').querySelectorAll('button').forEach(b => b.onclick = () => tocarFaixa(+b.dataset.i));
}
function abrirMusica(tocar) {
  $('musica').classList.add('aberto');
  $('abrirLista').setAttribute('aria-expanded', 'true');
  if (tocar && !AUD.tocando) tocarFaixa(D.faixa);
  toast(L('Playlist de estudo: escolha uma faixa','Playlist de estudio: elige una pista','Study playlist: pick a track'));
}
$('tocar').onclick = () => AUD.tocando ? pararFaixa() : tocarFaixa(D.faixa);
$('hospital').onclick = () => { ligarSons(!D.sons); toast(D.sons ? L('Sons do hospital ligados','Sonidos de hospital activados','Hospital sounds on') : L('Sons do hospital desligados','Sonidos de hospital desactivados','Hospital sounds off')); };
// o navegador só libera o som depois de um toque: religa os sons do hospital no primeiro clique
if (D.sons) {
  $('hospital').setAttribute('aria-pressed', 'true');
  addEventListener('pointerdown', () => { if (D.sons && !AMB.parar) ligarSons(true); }, { once:true });
}
$('proxFaixa').onclick = () => tocarFaixa(D.faixa + 1);
$('abrirLista').onclick = () => {
  const ab = $('musica').classList.toggle('aberto');
  $('abrirLista').setAttribute('aria-expanded', String(ab));
};
$('volume').value = D.volume;
$('volume').oninput = e => { D.volume = +e.target.value; if (AUD.master) AUD.master.gain.value = D.volume; salvar(); };
atualizarMusica();

// ===================== teclado =====================
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') return MODO === 'sala' && G && G.tipo !== 'menu' ? menuSala(SALA) : sairParaCampus();
  const quiz = G && (G.tipo === 'sala' || G.tipo === 'simulado') && $('ops');
  if (quiz) {
    const idx = { '1':0, '2':1, '3':2, '4':3, '5':4, a:0, b:1, c:2, d:3, e:4 }[k];
    if (idx !== undefined && idx < G.fila[G.i].o.length && G.res.length === G.i) { responder(idx); return; }
    if (e.key === 'Enter' && !$('prox')?.disabled && document.activeElement !== $('prox')) $('prox').click();
    return;
  }
  if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) { teclas[k] = true; e.preventDefault(); }
});
addEventListener('keyup', e => { teclas[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in teclas) teclas[k] = false; });
$('voltar').onclick = () => sairParaCampus();
</script>
