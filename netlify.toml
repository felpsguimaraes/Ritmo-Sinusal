# Publicação do site no Netlify.
# O site é estático: não há build, o Netlify só serve os arquivos do repositório.

[build]
  publish = "."
  command = ""

# A raiz é o painel do Sinus.
[[redirects]]
  from = "/painel"
  to = "/"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Os arquivos cifrados e os PDFs não precisam ser reprocessados
[[headers]]
  for = "/aulas/*/pdf/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
