@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--ink:#102d25;--ink2:#1a4030;--muted:#778980;--green:#0c8059;--bright:#08a86e;--bg:#fafdfb;--line:rgba(63,120,91,.17);--white:#fff;--shadow:0 24px 72px #075f3a16;--radius:25px;--glass:rgba(255,255,255,.56)}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{font:15px 'DM Sans',system-ui,-apple-system,sans-serif;color:var(--ink);margin:0;min-height:100dvh;background:radial-gradient(circle at 12% 89%,rgba(101,214,149,.10),transparent 29%),radial-gradient(circle at 90% 17%,rgba(79,210,158,.10),transparent 23%),#fafdfb;overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}a{color:inherit;text-decoration:none}img{max-width:100%}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #54cc9c;outline-offset:3px}svg{display:block}input[type=checkbox]{accent-color:#087e58}
button,.glass{ -webkit-tap-highlight-color:transparent}#app{min-height:100dvh} .hidden,[hidden]{display:none!important}
#toolbar{height:82px;max-width:1250px;margin:auto;padding:19px 35px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;z-index:12}.brand{display:inline-flex;width:147px;flex:none}.brand svg{width:100%}.top-note{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#69937c}.langrow{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px;background:#ffffffa3;box-shadow:0 5px 25px #115a3112}.langrow button{display:flex;gap:5px;align-items:center;border:0;border-radius:999px;padding:8px 11px;background:transparent;font-size:12px;color:#597263;font-weight:750}.langrow button.on{background:linear-gradient(160deg,#e2f6e9,#fff);box-shadow:inset 0 0 0 1px #afdfc4;color:#065137}.top-right{display:flex;align-items:center;gap:14px}.plain{border:0;background:transparent;color:#406855;font-size:12px;font-weight:700}.glass-pill{border:1px solid #95cfacb8;color:#113d2b;background:linear-gradient(135deg,#ffffffe8 0%,#e6f9eeac 53%,#c9f6e2b9);border-radius:999px;box-shadow:inset 0 2px 1px #fff, inset 0 -2px 5px #54c3873d,0 13px 29px #22835b21;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);font-weight:800;transition:transform .2s,box-shadow .2s}.glass-pill:hover{transform:translateY(-2px);box-shadow:inset 0 1px #fff,0 16px 34px #177b5239}.glass-pill:active{transform:translateY(1px)}.glass-primary{color:white;background:linear-gradient(130deg,#167d58,#04432f 58%,#047347);box-shadow:inset 0 2px 3px #b6ffe475, inset 0 -4px 9px #042e1e,0 15px 34px #11754b36;border-color:#59b98d;position:relative;overflow:hidden}.glass-primary:before{content:'';position:absolute;inset:2px 10% auto 10%;height:40%;border-radius:50%;background:linear-gradient(#fff7,transparent);filter:blur(8px);pointer-events:none}.glass-primary:hover{box-shadow:inset 0 1px #c8ffe0,0 20px 36px #08734b44}.btn{display:inline-flex;justify-content:center;align-items:center;gap:15px;padding:15px 23px;min-height:53px;font-weight:800;font-size:14px;border-radius:999px}.btn.big{min-height:64px;padding:18px 34px;font-size:17px}.btn.wide{width:100%}.subtle{font-size:12px;color:#719185}.eyebrow{letter-spacing:.16em;font-size:11px;font-weight:800;color:#4b886a;text-transform:uppercase}.skip-link{position:absolute;left:-9999px;top:0}.skip-link:focus{left:12px;top:12px;background:white;z-index:100;padding:14px}.section{max-width:1220px;margin:auto;padding:25px 28px 65px}.transition-in{animation:appear .4s ease-out both}@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
/* Liquid 3D sphere scene, using the approved image as its content */
.scene{width:min(580px,94vw);height:min(540px,61vh);min-height:370px;position:relative;isolation:isolate;display:grid;place-items:center;perspective:1200px;margin:auto}.scene:after{content:'';position:absolute;bottom:10%;width:53%;height:10%;border-radius:50%;background:#07825221;filter:blur(26px);z-index:-1}.sphere-stage{width:min(450px,83%);aspect-ratio:1;position:relative;transform-style:preserve-3d;animation:sphereFloat 7s ease-in-out infinite;will-change:transform;transition:filter .3s}.sphere-image{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 16px 24px #0f91521c);border-radius:50%;user-select:none;pointer-events:none}.pulse-overlay{position:absolute;inset:27%;border-radius:50%;box-shadow:0 0 90px #33de8e0e;pointer-events:none}.orb{position:absolute;aspect-ratio:1;border-radius:50%;border:1px solid #e9fff7cc;background:radial-gradient(circle at 28% 18%,#ffffffed 1%,#f6fff98a 18%,#b5efcc66 42%,#1fa36c26 74%,#ffffff8a 90%);box-shadow:inset 9px 8px 16px #ffffffd6,inset -8px -10px 14px #0e97504d,0 10px 25px #359f6433;backdrop-filter:blur(4px);z-index:-1;animation:orbFloat var(--speed,9s) ease-in-out infinite alternate;animation-delay:var(--delay,0s);transform:translate3d(0,0,var(--depth,0px))}.orb.o1{width:77px;top:15%;left:5%;--delay:-2s;--speed:7s;--depth:85px}.orb.o2{width:112px;top:6%;right:3%;--delay:-4s;--speed:10s;--depth:-50px}.orb.o3{width:45px;bottom:20%;left:10%;--delay:-6s;--speed:8s}.orb.o4{width:62px;bottom:16%;right:4%;--delay:-1s;--speed:6s}.orb.o5{width:24px;top:43%;right:1%;--delay:-3s;--speed:8s}.scene.compact{width:min(370px,95vw);height:300px;min-height:300px}.scene.compact .sphere-stage{width:265px}.scene.compact .orb.o2{width:72px}.scene.compact .orb.o1{width:52px}@keyframes orbFloat{from{translate:0 -15px;rotate:-4deg}to{translate:15px 25px;rotate:9deg}}@keyframes sphereFloat{0%,100%{transform:translateY(5px) rotateY(-5deg) rotateX(3deg)}50%{transform:translateY(-17px) rotateY(7deg) rotateX(-3deg)}}
/* Welcome */

const tr=(pt,es,en)=>lang==='es'?es:lang==='en'?en:pt;
const knownGroups=['A','B','C','D','E','F','G','H','I','J'];
const choice=(field,items)=>`<div class="choices ${field==='group'?'group-chips':''}" role="group" aria-label="${field==='focus'?'Seleção múltipla de foco de estudo':field}">${items.map(([v,l])=>{const active=field==='focus'?((Array.isArray(profile.focus)?profile.focus:[]).includes(v)):field==='group'&&v==='Outra'?!knownGroups.includes(profile.group)&&profile.group!=='Não definida'&&profile.group!=='Internato':String(profile[field])===String(v);return `<button type="button" class="choice ${active?'on':''}" data-field="${field}" data-value="${esc(v)}" aria-pressed="${active}">${l}</button>`}).join('')}</div>`;
function periodOptions(){const options=Array.from({length:10},(_,i)=>{const v=(i+1)+'º';return `<button type="button" class="period-option ${profile.period===v?'on':''}" data-field="period" data-value="${v}" aria-pressed="${profile.period===v}">${v}</button>`}).join('');return `<div class="period-picker"><div class="period-grid" role="group" aria-label="${tr('Escolha seu período','Elige tu semestre','Select your term')}">${options}</div><button type="button" class="internato-option ${profile.period==='Internato'?'on':''}" data-field="period" data-value="Internato" aria-pressed="${profile.period==='Internato'}"><span><strong>✚ ${tr('Internato','Internado','Internship')}</strong><small>${tr('Acessar o painel Revalida','Acceder al panel Revalida','Access the Revalida dashboard')}</small></span><span class="entry-arrow" aria-hidden="true">↗</span></button></div>`}
function groupOptions(){const isCustom=profile.group==='Outra'||(profile.group!=='Internato'&&profile.group!=='Não definida'&&!knownGroups.includes(profile.group));return `<div class="group-picker">${choice('group',[...knownGroups.map(g=>[g,g]),['Outra',tr('Outra turma','Otro grupo','Other group')],['Não definida',tr('Ainda não definida','Aún sin definir','Not assigned yet')]])}${isCustom?`<input class="inp" id="groupCustom" name="groupCustom" maxlength="24" autocomplete="off" value="${esc(profile.group==='Outra'?'':profile.group)}" placeholder="${tr('Digite sua turma (ex.: K, 7C)','Escribe tu grupo (ej.: K, 7C)','Enter your group (e.g., K, 7C)')}" aria-label="${tr('Outra turma','Otro grupo','Other group')}">`:''}<p class="group-help">${tr('Escolha a letra da sua turma. Se for diferente, use “Outra turma”.','Selecciona la letra del grupo o usa “Otro grupo”.','Choose your group letter or select “Other group”.')}</p></div>`}
function internatoOptions(){return `<div><div class="internato-info"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v18M3 12h18"/><path d="M6 6h12v12H6z" stroke-opacity=".28"/></svg><span><strong>${tr('Painel Revalida ativado','Panel Revalida activado','Revalida dashboard selected')}</strong><small>${tr('No internato você acessa a área Revalida; não precisa escolher uma turma.','En el internado accedes a Revalida y no necesitas elegir grupo.','During internship, use Revalida; choosing a class group is optional.')}</small></span></div><input class="inp rotation-input" id="rotation" name="rotation" maxlength="70" value="${esc(profile.rotation||'')}" placeholder="${tr('Equipe ou rodízio (opcional)','Equipo o rotación (opcional)','Team or clinical rotation (optional)')}" aria-label="${tr('Equipe ou rodízio','Equipo o rotación','Team or rotation')}"></div>`}

const focusText=()=>{const list=Array.isArray(profile.focus)?profile.focus.filter(Boolean):profile.focus?[profile.focus]:[];return list.length?list.join(' · '):'Teoria';};
function profilePage(){return `<main class="profiling flow transition-in"><button class="top-back" data-action="back">← ${tx('back')}</button>${d(2)}${scene(true)}<h1>${tx('personal')} <span class="accent">${tx('personal2')}</span></h1><p class="lede">${tx('profDesc')}</p><div class="formcard"><div class="formrow"><label class="label" for="name">${tx('whatName')}</label><input class="inp" id="name" name="name" maxlength="45" value="${esc(profile.name)}" placeholder="Ex.: Felipe" autocomplete="given-name"></div><div class="formrow"><label class="label" for="school">${tx('school')}</label><input class="inp" id="school" name="school" maxlength="55" value="${esc(profile.school)}" placeholder="Ex.: UCP"></div><div class="formrow"><label class="label">${tx('period')}</label>${periodOptions()}</div><div class="formrow"><label class="label">${profile.period==='Internato'?tr('Área / rodízio','Área / rotación','Clinical rotation'):tx('group')}</label>${profile.period==='Internato'?internatoOptions():groupOptions()}</div></div><div class="profile-actions">${btn(tx('next')+' →','preferences',true,'wide')}</div></main>`}
function prefs(){return `<main class="profiling flow transition-in"><button class="top-back" data-action="back">← ${tx('back')}</button>${d(3)}${scene(true)}<h1>${tx('focusTitle')}</h1><p class="lede">${tx('focusDesc')}</p><div class="formcard"><div class="formrow"><label class="label">${tx('language')}</label>${choice('language',[['pt','🇧🇷 Português'],['es','🇵🇾 Español'],['en','🇺🇸 English']])}</div><div class="formrow"><label class="label">${tx('focus')}<div class="subtle" style="margin-top:6px">${lang==='en'?'Choose one or more':lang==='es'?'Selecciona una o varias':'Selecione uma ou várias'}</div><span class="focus-count" aria-live="polite">${profile.focus.length} ${lang==='en'?'selected':lang==='es'?'seleccionada(s)':'selecionada(s)'}</span></label>${choice('focus',[['Teoria','Teoria'],['Prática','Prática'],['Questões','Questões'],['Revisões','Revisões']])}</div><div class="switchrow"><span>${tx('reminders')}<small>Configuração local nesta demo</small></span><input id="notifications" class="toggle" type="checkbox" ${profile.notifications?'checked':''} aria-label="${tx('reminders')}"></div><div class="switchrow"><span>${tx('favorites')}</span><input id="favorites" class="toggle" type="checkbox" ${profile.favorites?'checked':''} aria-label="${tx('favorites')}"></div></div><div class="profile-actions">${btn(tx('finish')+' →','finish',true,'wide')}</div><p class="hint">${tx('accountNote')}</p></main>`}
function ready(){return `<main class="ready-wrap transition-in">${d(4)}${scene(true)}<h1>${tx('ready').replace('.','<span class="accent">.</span>')}</h1><p class="lede">${tx('readyDesc')}<br>${profile.name?`<strong>${esc(profile.name)}</strong> · `:''}${esc(profile.school||'UCP')} · ${esc(profile.period)}${profile.period==='Internato'?' · Painel Revalida':` · ${esc(profile.group)}`}</p><div class="ready-cards"><div class="ready-card"><span class="ico">📚</span><b>${tx('materials')}</b><small>PDFs, vídeos, áudios, slides</small></div><div class="ready-card"><span class="ico">🩺</span><b>${esc(focusText())}</b><small>Seu foco de estudo</small></div><div class="ready-card"><span class="ico">✦</span><b>Sinus IA</b><small>Resumos, questões e revisões</small></div></div><div class="ready-actions">${btn(tx('panel')+' ↗','realPlatform',true)}${profile.period==='Internato'?btn(tr('Ver painel Revalida (demo)','Ver panel Revalida (demo)','View Revalida preview'),'revalidaDemo',false):btn(tx('preview'),'dashboard',false)}</div><p class="real-access">${tx('accountNote')}</p></main>`}
let demoSubjects=[['🩺','Semiologia Médica I',69],['◌','Imagenología',54],['◈','Farmacología I',77],['♡','Fisiopatología I',48],['♧','Anatomía Patológica I',63],['♙','Medicina de la Familia',42]];
function dashboard(){return `<main class="dashboard transition-in"><aside class="sidebar"><div class="school">Meu espaço de Medicina<br>${esc(profile.school||'UCP')} · ${esc(profile.period)} · ${esc(profile.group)}</div>${[['inicio','⌂','Início'],['materias','▤','Matérias'],['biblioteca','▥','Biblioteca'],['revalida','✚','Revalida'],['ia','✦','Sinus IA'],['preview','▣','Telas reais'],['apresentacao','✦','Jornada visual'],['config','⚙','Perfil']].map(([id,symbol,label])=>`<button class="nav ${selectedTab===id?'on':''}" data-tab="${id}">${symbol} ${label}</button>`).join('')}</aside><section class="main-panel"><div class="dash-bar"><strong>${tx('dashboard')} › ${selectedTab==='materias'?'Matérias':selectedTab}</strong><span class="status">${tx('demoLabel')}</span></div>${mainContent()}</section></main>`}
function mainContent(){if(selectedTab==='revalida')return `<div class="revalida-hero"><div class="eyebrow">${tr('INTERNATO · PREPARAÇÃO','INTERNADO · PREPARACIÓN','INTERNSHIP · EXAM PREP')}</div><h1>Painel <span class="accent">Revalida.</span></h1><p>${tr('Área de prévia do Internato: trilhas de revisão, questões, casos clínicos e simulados. Os conteúdos reais continuam no painel acadêmico original.','Vista previa del internado: revisiones, preguntas, casos y simulacros. El contenido real permanece en el panel original.','Internship preview with reviews, questions, clinical cases and mock exams. Actual content remains in the original platform.')}</p>${profile.rotation?`<p class="subtle">${tr('Seu rodízio','Tu rotación','Your rotation')}: ${esc(profile.rotation)}</p>`:''}</div><div class="revalida-cards"><div class="revalida-card"><strong>🩺 ${tr('Casos clínicos','Casos clínicos','Clinical cases')}</strong><p>${tr('Estudo por apresentações clínicas e raciocínio diagnóstico.','Estudio por casos y razonamiento diagnóstico.','Clinical scenarios and diagnostic reasoning.')}</p></div><div class="revalida-card"><strong>▤ ${tr('Questões','Preguntas','Questions')}</strong><p>${tr('Organização para treinamento com questões e revisão de erros.','Organización para prácticas y revisión de errores.','Practice questions and error review.')}</p></div><div class="revalida-card"><strong>◷ ${tr('Simulados','Simulacros','Mock exams')}</strong><p>${tr('Acompanhamento do seu preparo durante o Internato.','Sigue tu preparación durante el internado.','Monitor preparation during your internship.')}</p></div><div class="revalida-card"><strong>📚 ${tr('Biblioteca clínica','Biblioteca clínica','Clinical library')}</strong><p>${tr('Materiais da plataforma original, sem alterar os visualizadores.','Materiales del panel original, sin cambiar los visores.','Resources from the original platform; existing viewers are unchanged.')}</p></div></div><div class="dash-actions">${btn(tx('live')+' ↗','realPlatform',true)}${btn(tr('Editar meu período','Cambiar mi semestre','Edit my academic term'),'profile',false)}</div><p class="hint">${tr('Prévia visual: esta página não afirma que os recursos estão habilitados na conta real.','Vista previa: no significa que los recursos estén habilitados en la cuenta real.','Visual preview only: features may differ on the real account.')}</p>`;if(selectedTab==='materias'||selectedTab==='inicio')return `<div class="eyebrow">${profile.period==='Internato'?'INTERNATO · REVALIDA':`${esc(profile.period)} PERÍODO · TURMA ${esc(profile.group)}`} </div><h1 class="dash-title">${selectedTab==='inicio'?'Olá, '+esc(profile.name||'estudante')+'!':tx('subjects')}</h1><p class="dash-sub">${esc(profile.school||'UCP')} · Prévia baseada no visual aprovado. Para seus materiais reais, abra o painel original.</p><div class="subject-grid">${demoSubjects.map(([icon,name,prog])=>`<button class="subject" data-action="realPlatform"><span class="symbol">${icon}</span><b>${name}</b><small>Teoria · Prática · Acervo</small><span class="track"><i style="width:${prog}%"></i></span></button>`).join('')}</div><div class="dash-box"><h2>Seu estudo. Seu tempo.</h2><div class="dash-actions">${btn(tx('live')+' ↗','realPlatform',true)}${btn('Ver players e PDFs','preview',false)}${btn('Personalizar perfil','config',false)}</div></div>`;
if(selectedTab==='preview'||selectedTab==='biblioteca')return `<h1 class="dash-title">${tx('materials')} <span class="accent">Sinus.</span></h1><p class="dash-sub">Capturas do painel acadêmico real — visualizadores de PDFs, vídeos, slides e lista de matérias.</p><div class="screen-tabs">${[['materias','Matérias'],['provas','Provas / PDF'],['slides','Slides'],['videos','Vídeos']].map(([id,title])=>`<button class="${selectedView===id?'on':''}" data-view="${id}">${title}</button>`).join('')}</div><div class="laptop"><div class="laptop-screen"><img id="big-preview" src="assets/${selectedView}.webp" alt="Captura real do painel Sinus - ${selectedView}"></div></div><div class="dash-actions">${btn('Abrir acervo e players reais ↗','realPlatform',true)}</div>`;

if(selectedTab==='apresentacao')return `<h1 class="dash-title">Jornada de entrada <span class="accent">Sinus.</span></h1><p class="dash-sub">Conceitos visuais aprovados que orientaram a tela de login, instalação e personalização. As telas reais são interativas nas etapas iniciais.</p><div class="gallery">${[['conceito-1.webp','01 · Entrada e login'],['conceito-2.webp','02 · Instalação'],['conceito-3.webp','03 · Personalização'],['conceito-4.webp','04 · Plataforma pronta']].map(([src,name])=>`<figure><img loading="lazy" src="assets/${src}" alt="${name}"><figcaption>${name}</figcaption></figure>`).join('')}</div><div class="dash-actions">${btn('Rever as etapas','reset',false)}${btn('Abrir painel real ↗','realPlatform',true)}</div>`;
if(selectedTab==='config')return `<h1 class="dash-title">Seu perfil</h1><p class="dash-sub">Personalizações de demonstração salvas neste navegador.</p><div class="dash-box"><p><strong>${esc(profile.name||'Estudante')}</strong> · ${esc(profile.school)} · ${esc(profile.period)}${profile.period==='Internato'?' · Revalida':` · ${esc(profile.group)}`}</p><p>Idioma: ${esc(profile.language)} · Foco: ${esc(focusText())}</p><div class="dash-actions">${btn('Editar preferências','profile',false)}${btn('Rever apresentação','reset',false)}${btn('Abrir plataforma real ↗','realPlatform',true)}</div></div>`;
return ''}
let selectedView='materias';function show(){document.documentElement.lang=lang==='pt'?'pt-BR':lang==='es'?'es-PY':'en';const content=step==='welcome'?welcome():step==='install'?install():step==='profile'?profilePage():step==='preferences'?prefs():step==='ready'?ready():dashboard();qs('#app').innerHTML=header()+content+footer();document.title='Sinus — '+tx('welcome')+' '+tx('time');qs('body').dataset.screen=step;setTimeout(initScene,0);if(step==='install') updateInstallText();window.scrollTo({top:0,behavior:'instant'});}
function footer(){return step==='dashboard'?`<div class="footerline">SINUS · Demonstração visual · <a href="${REAL}" rel="noopener">Abrir plataforma original ↗</a></div>`:''}
function route(st){step=st;if(step==='dashboard'&&store.complete){store.seen=true;save()}show()}
function modal(){lastFocus=document.activeElement;const el=document.createElement('div');el.className='scrim';el.id='auth-modal';el.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close" data-action="close">×</button><div class="eyebrow">SINUS · PRIMEIRO ACESSO</div><h2 id="modal-title">${tx('signInInfo')}</h2><p>${tx('authDesc')}</p><a class="btn glass-pill glass-primary wide" href="${REAL}" rel="noopener">${tx('realLogin')} ↗</a><button class="btn glass-pill wide" data-action="demo">${tx('testFlow')} →</button></section>`;document.body.appendChild(el);qs('.close').focus();el.addEventListener('click',e=>{if(e.target===el)closeModal()})}
function closeModal(){qs('#auth-modal')?.remove();lastFocus?.focus?.()}
let moved=false;function initScene(){const scene=qs('.scene');if(!scene)return;scene.addEventListener('pointermove',e=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const box=scene.getBoundingClientRect();let x=(e.clientX-box.left)/box.width-.5,y=(e.clientY-box.top)/box.height-.5;scene.querySelector('.sphere-stage').style.transform=`translateY(-5px) rotateY(${x*16}deg) rotateX(${-y*13}deg)`});scene.addEventListener('pointerleave',()=>{scene.querySelector('.sphere-stage').style.transform='';})}
function handleAction(action){switch(action){case 'welcome':route('welcome');break;case 'auth':modal();break;case 'close':closeModal();break;case 'demo':closeModal();route('install');break;case 'installPwa':installNow();break;case 'install':route('install');break;case 'profile':route('profile');break;case 'preferences':readInputs();route('preferences');break;case 'finish':selectedTab=profile.period==='Internato'?'revalida':'materias';profile.language=lang;profile.notifications=qs('#notifications')?.checked||false;profile.favorites=qs('#favorites')?.checked||false;store.complete=true;save();route('ready');break;case 'back':route(step==='install'?'welcome':step==='profile'?'install':step==='preferences'?'profile':'ready');break;case 'dashboard':route('dashboard');break;case 'revalidaDemo':selectedTab='revalida';route('dashboard');break;case 'preview':selectedTab='preview';route('dashboard');break;case 'config':selectedTab='config';route('dashboard');break;case 'realPlatform':window.location.assign(REAL);break;case 'reset':if(confirm('Reabrir o processo de apresentação nesta demo?')){store.complete=false;try{localStorage.removeItem(K)}catch(e){}profile={...initial,focus:[...initial.focus]};route('welcome')}break;}}
function readInputs(){qsa('input[name]').forEach(el=>{if(el.name==='groupCustom')profile.group=el.value.trim()||'Não definida';else profile[el.name]=el.value.trim()});save()}
document.addEventListener('click',e=>{const l=e.target.closest('[data-lang]');if(l){lang=l.dataset.lang;profile.language=lang;save();show();return}const c=e.target.closest('[data-field]');if(c){const field=c.dataset.field,val=c.dataset.value;if(field==='focus'){const current=Array.isArray(profile.focus)?[...profile.focus]:[];profile.focus=current.includes(val)?current.filter(v=>v!==val):[...current,val];if(!profile.focus.length)profile.focus=[val];}else if(field==='period'){const before=profile.period;profile.period=val;if(val==='Internato'){if(profile.group!=='Internato')profile.lastGroup=profile.group;profile.group='Internato';selectedTab='revalida'}else if(before==='Internato'){profile.group=profile.lastGroup&&profile.lastGroup!=='Internato'?profile.lastGroup:'Não definida';selectedTab='materias'}}else if(field==='group'){profile.group=val}else{profile[field]=val;if(field==='language'){lang=profile.language}}save();show();return}const tab=e.target.closest('[data-tab]');if(tab){selectedTab=tab.dataset.tab;show();return}const v=e.target.closest('[data-view]');if(v){selectedView=v.dataset.view;show();return}const act=e.target.closest('[data-action]');if(act){e.preventDefault();handleAction(act.dataset.action)}});
document.addEventListener('input',e=>{if(e.target.matches('input[name]')){profile[e.target.name]=e.target.value;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();beforeInstall=e;updateInstallText()});
window.addEventListener('appinstalled',()=>{beforeInstall=null;updateInstallText()});
async function installNow(){if(beforeInstall){await beforeInstall.prompt();const choice=await beforeInstall.userChoice;beforeInstall=null;const e=qs('#installHelp');if(e)e.textContent=choice.outcome==='accepted'?'Instalação solicitada. Confira sua tela inicial.':'Você pode instalar depois pelas configurações.'}else{updateInstallText(true)}}
function updateInstallText(explicit=false){let e=qs('#installHelp');if(!e)return;let standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;const ios=/iPad|iPhone|iPod/i.test(navigator.userAgent);if(standalone)e.textContent='A Sinus já está aberta no modo aplicativo.';else if(beforeInstall)e.textContent='Instalação compatível detectada. Toque em Instalar neste dispositivo.';else if(ios)e.textContent='iPhone / iPad: abra no Safari, toque em Compartilhar (□↑) e escolha “Adicionar à Tela de Início”. O navegador não permite instalação automática.';else e.textContent='Para instalar: abra esta página em HTTPS no Chrome ou Edge, abra o menu (⋮) e selecione “Instalar aplicativo” ou “Adicionar à tela inicial”.';if(explicit)e.scrollIntoView({behavior:'smooth',block:'center'})}

if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
show();
})();
